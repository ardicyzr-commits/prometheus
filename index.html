/* ============================================================
   ETKİLEŞİM
   ============================================================ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const ptr = { x: -1, y: -1, down: false, sx: 0, sy: 0, lx: 0, ly: 0, gest: null, moved: false, type: 'mouse', vx: 0, inPanel: false, dirty: false, t: 0 };
function setFilter(k) { filter = k; buildHUD(); }
function act(a) {
  if (!a) return;
  if (a.type === 'view') goTo(a.i);
  else if (a.type === 'filter') setFilter(a.k);
  else if (a.type === 'topic') Panel.show('topic', a.i);
  else if (a.type === 'decision') Panel.show('decision', a.i);
}
function hudHitAt(x, y) { for (const h of hudHits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; return null; }
function worldHit(x, y) {
  ndc.set(x / W * 2 - 1, -(y / H) * 2 + 1); ray.setFromCamera(ndc, camera);
  const v = VIEWS[current]; const hits = ray.intersectObjects(v.picks.filter(o => o.visible), false);
  return hits.find(h => (h.object.material.opacity ?? 1) > 0.15) || null;
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  cv.focus({ preventScroll: true });
  Object.assign(ptr, { down: true, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, gest: null, moved: false, type: e.pointerType, vx: 0, t: performance.now() });
  ptr.inPanel = Panel.open && !Panel.hit(e.clientX, e.clientY).outside;
  if (Panel.open) Panel.vel = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.dirty = true;
  if (e.pointerType === 'mouse') parT.set(e.clientX / W * 2 - 1, -(e.clientY / H * 2 - 1));
  if (!ptr.down) return;
  const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly; ptr.lx = e.clientX; ptr.ly = e.clientY;
  const tx = e.clientX - ptr.sx, ty = e.clientY - ptr.sy;
  if (!ptr.moved && Math.hypot(tx, ty) > 7) { ptr.moved = true; ptr.gest = Math.abs(tx) > Math.abs(ty) ? 'h' : 'v'; }
  if (!ptr.moved) return;
  if (Panel.open) { if (ptr.inPanel) { Panel.scrollBy(-dy); Panel.vel = -dy; } return; }
  if (ptr.gest === 'h' || (ptr.type === 'mouse' && ptr.gest)) { VIEWS[current].drag(ptr.gest === 'h' ? dx : 0); ptr.vx = dx; }
});
cv.addEventListener('pointerup', e => {
  if (!ptr.down) return; ptr.down = false;
  const x = e.clientX, y = e.clientY;
  if (!ptr.moved) {
    if (Panel.open) {
      const h = Panel.hit(x, y);
      if (h.outside) Panel.close();
      else if (h.btn === 'close') Panel.close(); else if (h.btn === 'next') Panel.step(1); else if (h.btn === 'prev') Panel.step(-1);
      else if (h.action) act(h.action);
      return;
    }
    const hh = hudHitAt(x, y); if (hh) { act(hh.action); return; }
    const wh = worldHit(x, y); if (wh) VIEWS[current].click(wh);
    return;
  }
  if (Panel.open) return;
  if (ptr.gest === 'h' || ptr.type === 'mouse') VIEWS[current].dragEnd(ptr.vx);
  if (ptr.gest === 'v' && ptr.type !== 'mouse') { const ty = y - ptr.sy; if (Math.abs(ty) > 50 && !flying) goTo(current + (ty < 0 ? 1 : -1)); }
});
cv.addEventListener('pointercancel', () => { ptr.down = false; VIEWS[current].dragEnd(0); });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { parT.set(0, 0); Tip.hide(); } });
let wheelAcc = 0, wheelLock = 0;
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  if (Panel.open) { Panel.scrollBy(dy); return; }
  if (current === 2 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) { V2.drag(-e.deltaX); return; }
  const now = performance.now(); if (now < wheelLock) return;
  wheelAcc += dy;
  if (Math.abs(wheelAcc) > 80) { goTo(current + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 1100; }
}, { passive: false });
window.addEventListener('keydown', e => {
  if (Panel.open) {
    if (e.key === 'Escape') Panel.close();
    else if (e.key === 'ArrowRight') Panel.step(1); else if (e.key === 'ArrowLeft') Panel.step(-1);
    else if (e.key === 'ArrowDown') Panel.scrollBy(60); else if (e.key === 'ArrowUp') Panel.scrollBy(-60);
    else if (e.key === 'PageDown' || e.key === ' ') Panel.scrollBy(Panel.viewH * 0.85); else if (e.key === 'PageUp') Panel.scrollBy(-Panel.viewH * 0.85);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') goTo(current + 1);
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') goTo(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const d = e.key === 'ArrowRight' ? 1 : -1, v = VIEWS[current];
    if (v.key) v.key(d); else if (current === 1) V1.rotVel = -d * 0.05; else if (current === 2) V2.drag(-d * 120);
  }
  else if (/^[1-5]$/.test(e.key)) goTo(+e.key - 1);
  else if (e.key === 'Home') goTo(0); else if (e.key === 'End') goTo(4);
});

function doHover() {
  ptr.dirty = false;
  if (ptr.type !== 'mouse' || ptr.down) return;
  let cursor = false;
  if (Panel.open) {
    const h = Panel.hit(ptr.x, ptr.y), hv = h.btn || h.action || null;
    if (hv !== Panel.hov) { Panel.hov = hv; Panel.draw(); }
    cursor = !!hv || h.outside;
    Tip.hide();
  } else if (hudHitAt(ptr.x, ptr.y)) { cursor = true; Tip.hide(); VIEWS[current].hover(null); }
  else if (!flying) {
    const r = VIEWS[current].hover(worldHit(ptr.x, ptr.y));
    cursor = !!(r && r.cursor);
    if (r && r.tip) Tip.show(r.tip, ptr.x, ptr.y); else Tip.hide();
  }
  cv.style.cursor = cursor ? 'pointer' : (ptr.down ? 'grabbing' : 'default');
}

function onResize() {
  W = innerWidth; H = innerHeight; MOBILE = W < 760;
  renderer.setSize(W, H); composer.setSize(W, H); bloom.setSize(W / 2, H / 2);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  hudCam.right = W; hudCam.top = H; hudCam.updateProjectionMatrix();
  const a = anchor(current); if (!flying) { basePos.copy(a.pos); baseTarget.copy(a.tgt); }
  buildHUD(); Tip.hide();
  if (Panel.open) { Panel.build(); Panel.scrollBy(0); }
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(onResize, 80); });

/* ============================================================
   BAŞLAT
   ============================================================ */
async function fontsReady() {
  if (!document.fonts) return;
  const loads = [400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 16px Inter`, 'ĞğŞşİıÇçÖöÜü'));
  await Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
}
await fontsReady();
VIEWS.forEach(v => v.build());
buildHUD();
{ const a = anchor(0); baseTarget.copy(a.tgt); basePos.copy(a.pos).add(new THREE.Vector3(0, 14, 110)); }
goTo(0);

const DTMAX = +new URLSearchParams(location.search).get('dtmax') || 0.05;
let last = performance.now(), time = 0;
function loop(now) {
  const dt = Math.min(DTMAX, (now - last) / 1000); last = now; time += dt;
  runTweens(dt);
  for (const [i, v] of VIEWS.entries()) { v.group.visible = (i === current || flying) && Math.abs(camera.position.z - v.group.position.z) < 330; if (v.group.visible) v.update(dt, time); }
  stars.material.uniforms.uTime.value = time; journey.material.uniforms.uTime.value = time;
  updateCamera(dt);
  Panel.update(dt);
  if (ptr.dirty) doHover();
  composer.render();
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(hud, hudCam); renderer.autoClear = true;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__app = { goTo, Panel, VIEWS, setFilter, get current() { return current; } };
