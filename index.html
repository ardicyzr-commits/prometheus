ilmesi","kapsam":"Ticari ve bireysel kredi portföylerinde aksama, yapılandırma ve takipteki alacakların müşteri, ürün ve segment bazında kök neden analizi ile kullandırım yoğunlaşmaları ve teminat yapısının incelenmesi kapsam dahilindedir. Ayrıca yerel avukatlar ile Banka avukatlarının performans karşılaştırması, şube yetkisiyle tahsis edilip takibe düşen kredilerin GM'de kurulacak birimce takibi ve Kredi Risk Tasfiye ile Hukuk birimlerinin aynı çatı altında birleştirilmesi yer almaktadır.","kazanim":"Bankamız takip portföyünde yer alan müşterilerin ilgili birimler tarafından koordineli bir şekilde takip edilmesi sağlanarak, takip ve tahsilat çalışmalarında verimlilik artırılacak.","kararlar":[{"no":"Karar 25/1","tarih":"15 Eki 2026","metin":"Takip Portföyünün Verimli ve Etkin Yönetilmesi konusu kapsamında yapılan analiz çalışmasının düzenli olarak gerçekleştirilmesi, alınan aksiyonların sonuçlarının gözlemlenmesi ve belirli periyotlarla Dönüşüm Komitesi'ne sunulması"},{"no":"Karar 23/5","tarih":"1 Eki 2026","metin":"Bankamızın takipte izlenen risklerindeki artışa yönelik kök neden analizi yapılması; müşterilere yapılan kullandırımlardaki yoğunlaşmalar ile gelecekte risk artışına neden olabilecek müşteri, ürün ve segment bazlı unsurların analiz edilmesi; canlı/izleme/takip kredilerinin segment bazlı teminat yapısının analiz edilmesi ve yapılacak değerlendirme ve analizler doğrultusunda ilgili iş birimlerince gerekli önlem ve aksiyonların belirlenerek yol haritası oluşturulması ve konunun Dönüşüm Komitesi gündemine alınarak sunulması talimatı verilmiştir."},{"no":"Karar 15/1","tarih":"21 Tem 2026","metin":"Yerel avukatlar ile Banka avukatlarının performans karşılaştırmasının seçilecek illeri kapsayacak şekilde tekrarlanması ve sonuçların değerlendirilmesi."},{"no":"Karar 15/2","tarih":"21 Tem 2026","metin":"Şube yetkisiyle tahsis edilip takibe intikal eden kredilerin şube portföyünden çıkarılarak GM nezdinde kurulacak bir birim tarafından takip edilmesine yönelik çalışma yapılması."}]},{"g":"uygulama","ad":"Hukuk Görüşü Verilmesi Aşamasında Yapay Zeka Kullanımı","durum":"Faz 1 bitti","giris":"7 Tem 2026","hedef":"30 Eyl 2026","sorumlu":"Hukuk İşleri ve Yasal Takip","amac":"Şubelerin görüş talebinde bulunduğu konularda yapay zeka kullanılarak hızlı ve verimli bir şekilde doğru bilgiye erişilmesi","kapsam":"İlk aşamada teminat mektubu metinlerinin yapay zeka ile değerlendirilmesi, vekaletname ile yapılacak işlemler ve sıkça sorulan hukuki soruların yanıtlanması kapsam dahilindedir. Ayrıca teminat mektuplarında geçmiş görüşlerin tespiti ve metin değişikliklerinin vurgulanması, SSS asistanının Bizimyerimiz ve Bilio portallerinde sunulması ve mevduat işlemlerine ilişkin görüş süreçlerinde geliştirme yapılması planlanmaktadır.","kazanim":"Yapay zeka desteği ile zaman tasarrufu sağlanarak ve verimlilik artacak, doğru bilgiye hızlı bir şekilde ulaşılacak","kararlar":[{"no":"Karar 24/6","tarih":"9 Eki 2026","metin":"Teminat mektuplarında aynı muhatap ve metin için geçmiş hukuk görüşlerinin giriş aşamasında tespit edilmesi, Şubenin bilgilendirilmesi veya mevcut görüşün yeniden kullanılması alternatiflerinin değerlendirilmesi"},{"no":"Karar 24/7","tarih":"9 Eki 2026","metin":"Teminat mektuplarına ilişkin yapay zeka destekli hukuk görüşü sürecinde metin değişikliklerinin vurgulanarak gösterilmesine yönelik çalışma yapılması"},{"no":"Karar 24/8","tarih":"9 Eki 2026","metin":"Hukuk görüşlerine ilişkin sıkça sorulan soruları yanıtlayacak yapay zeka asistanının Bizimyerimiz ve Bilio portallerinde sunulmasına yönelik çalışma yapılması"},{"no":"Karar 10/3","tarih":"22 Haz 2026","metin":"Şubelerden gelen hukuki görüş taleplerinde yapay zekâ kullanımına ilişkin çalışma yapılması."}]},{"g":"calisma","ad":"Yeni Ürün Stratejisi","durum":"Çalışılıyor","giris":"6 Ağu 2026","hedef":"—","sorumlu":"Strateji ve Ürün Geliştirme Başkanlığı","amac":"Bankamızın yeni ürün stratejisinin genel çerçevesi Komiteye arz edilmiştir.\n\nKalkınma Odaklı Değer Bankacılığı çerçevesinde 7 ana başlık ve bu ana başlıkları besleyecek şekilde konumlanan “Yetkinliğe Değer” başlığı oluşturulmuş olup söz konusu başlıklar Ülkemizin Orta Vadeli Programı’nın 7 temel politika alanı (makroekonomik istikrar, Ar-Ge ve yenilik, yeşil-dijital dönüşüm, beşeri sermaye, işgücü piyasası, yatırım ortamı ve kamu mali çerçevesi) ile eşleştirilmiştir.\n1 Ticarete Değer\n2 Üretime Değer\n3 İstihdama Değer\n4 Girişimciliğe Değer\n5 İhracata Değer\n6 Dönüşüme Değer\n7 Geleceğe Değer\n8 Yetkinliğe Değer\nBaşlıkları altında Bankamızın halihazırdaki ürünleri, yeni oluşturulacak ve lansmanı yapılacak ürünler, KGF/İGE kefaletleri, yurtdışı kaynak temini, dış ticaret odaklı ürünler, dijital ürünler çerçevesinde bilgilendirme yapılmıştır.\n\nKomite katılımcıları ise özellikle KGF-Banka sistemsel entegrasyonu, çerçevesi arz edilen ürünlerin müşterilere nasıl sunulacağı ve nasıl kazanımlar elde edileceğine ilişkin sorular yöneltmişler ve konuya ilişkin değerlendirmelerini paylaşmışlardır.","kapsam":"Mevcut, yeni ve lansmanı planlanan ürünlerin (KGF/İGE kefaletleri, yurt dışı kaynak, dış ticaret ve dijital ürünler) bu başlıklar altında konumlandırılması kapsam dahilindedir. Alt başlıklar olarak VİNOV İş Yeri Mobil'in yaygınlaştırılması, SKY KOBİ 2.0 ile ihracat ve KGF kefaletli kredilerin dijital kullandırımı ve yapay zeka tabanlı akıllı ürün önerisi (NBA) yürütülmektedir.","kazanim":"VİNOV İş Yeri Mobil ile ürünün stratejik olarak belirlenmesinin ardından ilk bir haftada 2,2 milyar TL'lik kayıt oluşturulmuştur. SKY KOBİ 2.0 ile baz senaryoda yaklaşık 1,8 milyar TL ek nakdi kredi bakiyesi öngörülmekte; NBA modeliyle daha yüksek ürün derinliği ve daha verimli dijital satış hedeflenmektedir.","alt":["Vinov İş Yeri Mobil","Sky KOBİ 2.0","AI Tabanlı Akıllı Ürün Önerisi"]},{"g":"calisma","ad":"Ürün Fiyatlama Sürecinin İyileştirilmesi","durum":"Çalışılıyor","giris":"5 May 2026","hedef":"31 Mar 2027","sorumlu":"Ödeme Sistemleri Pazarlama Başkanlığı","amac":"Bankamızdaki kredi fiyatlaması mevcut durumda yaklaşık 9 adımda gerçekleşmekte, e-posta ve telefon trafiği yaşanmaktadır. Ayrıca verilen yetki, fiyat ve fiyatlamaya konu taahhütlerin geçmiş bilgisi merkezi olarak izlenememektedir. Yeni süreçte, tüm akışın sistem üzerine alınması, e-posta ve telefon trafiğinin azalması, yetki, fiyat ve taahhütlerin izlenebilir ve raporlanabilir olması amaçlanmaktadır.","kapsam":"Kredi fiyatlama ve pazarlık süreçlerinin VIT üzerinden yürütülmesi, belirlenen koşullarda şubelere fiyatlama yetkisi verilmesi ve bu yetkilerin sistem üzerinden izlenmesi hedeflenmektedir. Ayrıca müşteri verimliliği ve kârlılığının fiyatlamada dikkate alınması, kredi kullandırım taahhütlerinin tanımlanarak gerçekleşmelerinin takip edilmesi kapsam dahilindedir.","kazanim":"Görev ataması ve hatırlatma mekanizmalarının güçlenmesi, hedef müşteri gruplarına, kanallara ve koşullara göre hızlı bir biçimde kampanya tanımlanabilmesi sağlanacaktır.","kararlar":[{"no":"Karar 17/1","tarih":"28 Tem 2026","metin":"Ürün Fiyatlama hedef tarihinin 30.09.2026'dan 31.12.2026'ya güncellenmesi; üye işyeri fiyatlamasının VFA üzerinden segmentlerle birlikte belirlenmesi için Ödeme Sistemleri Pazarlama ve Pazarlama Başkanlıklarının çalışma yapması."},{"no":"Karar 10/4","tarih":"22 Haz 2026","metin":"VIT-VFA yapısında hata payı olup olmadığına ilişkin çalışma yapılması."},{"no":"Karar 6/1","tarih":"25 May 2026","metin":"Normal fiyat dışı hareketler için pazarlama onayının zorunlu hale getirilmesi; fiyatlamanın uçtan uca sistem üzerinden alınması (1 Ekim 2026 canlı)."},{"no":"Karar 6/2","tarih":"25 May 2026","metin":"Üye işyeri fiyatlamalarındaki süreç değişikliğinin 1 Ekim'e kadar tamamlanması; ilgili ekiplerden aksiyon planı talep edilmesi."}]},{"g":"calisma","ad":"Ticari Kredi Süreçlerinin İyileştirilmesi","durum":"Çalışılıyor","giris":"5 May 2026","hedef":"31 Ara 2026","sorumlu":"Kurumsal ve Ticari Krediler Tahsis Yönetimi Başkanlığı 1, Kurumsal ve Ticari Krediler Tahsis Yönetimi Başkanlığı 2","amac":"Kredi tahsis süreçlerinin tamamının Ticari Kredi Dönüşüm Projesi’ne dahil edilerek mevcut ikili yapının giderilmesi.","kapsam":"PLATO'ya taşınmamış müşteri ve dosyaların 31.12.2026'ya kadar aktarılması ve tahsis ile operasyon birimlerinden oluşan proje ekibiyle geçiş sürecinin yürütülmesi kapsam dahilindedir. Ayrıca şubelerden gelen öneri ve şikayetler doğrultusunda TKD ekranlarının tekilleştirilmesi ile teminat, limit ve kullandırım kurgularına ilişkin sistemsel geliştirmeler yapılmaktadır.","kazanim":"Kredi tahsis süreçlerinde ikili yapı ortadan kalkacak, yeknesaklık sağlanacak ve tüm süreçler tek akış ile VIT sistemi üzerinden tamamlanacak.","kararlar":[{"no":"Karar 26/1","tarih":"23 Eki 2026","metin":"Sunumu gerçekleştirilen “Ticari Kredi Süreçlerinin İyileştirilmesi” ve “Bilgi Teknolojileri Ekipleri Tarafından Yürütülen Projeler” başlıklarının, tüm Genel Müdür Yardımcıları ve Grup Başkanlarının katılımıyla gerçekleştirilecek bir Dönüşüm Komitesi toplantısında yeniden gündeme alınarak ilgili çalışmalar hakkında kapsamlı bilgilendirme yapılmasına karar verilmiştir."},{"no":"Karar 13/1","tarih":"7 Tem 2026","metin":"TKD projesinin operasyon ve tahsis ekiplerince kurulacak çalışma grubu ile yıl sonuna kadar tamamlanması."},{"no":"Karar 11/1","tarih":"27 Haz 2026","metin":"Tahsis ve operasyon birimlerince proje ekibi oluşturularak platoya geçiş sürecinin 31.12.2026 tarihine kadar tamamlanması."},{"no":"Karar 10/1","tarih":"22 Haz 2026","metin":"B2B ve Firma İş Süreçleri Platformu, Kripto Hizmetleri ve TKD projesinin ayrı oturumlarda sunulması."}]},{"g":"calisma","ad":"Veri Kalitesi","durum":"Çalışılıyor","giris":"28 Tem 2026","hedef":"31 Ara 2026","sorumlu":"Güvenli Bankacılık Başkanlığı","amac":"Bankamız verilerinin kalitesini ve doğruluğunu sağlama","kapsam":"Müşteri veri kalitesine yönelik kural setleri ve görev atamaları, çalışılan kurum bilgisinin bordro/SGK verisinden otomatik doldurulması ve ürün kullandırımında eksik bilgi güncellemesinin zorunlu hale getirilmesi kapsam dahilindedir. Ayrıca e-posta adreslerinin doğrulanması, mobilden müşteri bilgisi doğrulama ve güncelleme, profil doluluk oranı gösterimi ve veri tüketen birimlerin de kural tanımlayabilmesi planlanmaktadır.","kazanim":"Bankamız müşteri verilerinin doğruluğu ve doluluğu sağlanarak bankacılık faaliyetleri daha verimli gerçekleştirilecek.","kararlar":[{"no":"Karar 17/2","tarih":"28 Tem 2026","metin":"Veri kalitesi için: çalışılan kurum bilgisinin bordro/SGK'dan otomatik doldurulması, ürün kullandırımında eksik bilgi güncellemesinin zorunlu olması, YZ projelerini destekleyen kural altyapısı, veri tüketenlerin de kural tanımlayabilmesi."}]},{"g":"uygulama","ad":"Yurt Dışı İştirakler Ana Bankacılık Uygulaması","durum":"Faz 1 bitti","giris":"7 Tem 2026","hedef":"30 Eyl 2026","sorumlu":"Kredi, Hazine ve Dış İşlemler Uygulama Geliştirme Başkanlığı","amac":"VakıfBank International AG'nin ana bankacılık uygulamasının ayağa kaldırılması, aynı zamanda Bankamız iç kaynakları ile ihtiyaçların karşılanacağı bir uygulama yazılması","kapsam":"Çalışma analiz, entegrasyon, geliştirme ve devreye alma adımlarını kapsamaktadır. Viyana Şubesi ana bankacılık sistemi geliştirme projesinde 31 ekibin 3 grup altında çalışması planlanmış olup ilk grup Müşteri, Mevduat, Muhasebe ve DYS modüllerini kapsamaktadır; dış firmadan temin edilen uygulamada bireysel internet bankacılığı çalışmaları da sürdürülmektedir.","kazanim":"Yurt dışı iştiraklerde teknoloji bağımsızlığının artırılması, ana bankacılık altyapısında kurum içi geliştirme kabiliyetlerinin güçlendirilmesi ve sürdürülebilir sistem mimarisi oluşturulması","kararlar":[{"no":"Karar 13/5","tarih":"7 Tem 2026","metin":"Yurt Dışı İştirakler Ana Bankacılık uygulamasının ayağa kaldırılması; iç kaynaklarla iştirak ihtiyaçlarını karşılayacak uygulama yazılması."}]},{"g":"tamam","ad":"Yurt Dışı İştirakler ODM Testleri","durum":"Tamamlandı","giris":"7 Tem 2026","hedef":"30 Kas 2026","sorumlu":"Güvenli Bankacılık Başkanlığı","amac":"VakıfBank International AG Olağanüstü Durum Merkezi iş sürekliliği testlerinin Güvenli Bankacılık Başkanlığı tarafından gerçekleştirilmesi","kapsam":"Yurt dışı iştiraklerin ODM ve iş sürekliliği testlerinin Güvenli Bankacılık Başkanlığı tarafından planlanması ve gerçekleştirilmesi kapsam dahilindedir; ilk olarak VakıfBank International Viyana Şubesi ODM testi ele alınmıştır.","kazanim":"Yurt dışı iştiraklerde iş sürekliliği kabiliyetinin güçlendirilmesi, operasyonel dayanıklılığın artırılması ve güvenli bankacılık standartlarının iştirak süreçlerine yaygınlaştırılması","kararlar":[{"no":"Karar 13/6","tarih":"7 Tem 2026","metin":"Yurt Dışı İştiraklerin ODM testlerinin Güvenli Bankacılık Başkanlığı tarafından gerçekleştirilmesi."}]},{"g":"calisma","ad":"Ödeme Sistemleri Dönüşümü","durum":"Çalışılıyor","giris":"7 Tem 2026","hedef":"31 Ara 2027","sorumlu":"Bilgi Teknolojileri, Dijital Bankacılık, Ödeme Sistemleri ve Kurumsal İletişim","amac":"Kritik bankacılık altyapılarında dışa bağımlılığın azaltılması, teknoloji sahipliğinin güçlendirilmesi ve kredi kartı altyapısında kurum içi geliştirme kabiliyetinin artırılması","kapsam":"Kredi kartı, debit/prepaid, Tarım Kart ve üye işyeri işlemlerinin kanal entegrasyonları ve dönüşümü (conversion), VISA/CUP/MIR switch entegrasyonları, POSMER/PGW entegrasyonu ve sanal POS altyapısı kapsam dahilindedir. Ayrıca kampanya ve puan yönetimi, fraud modülü, reeskont/mutabakat, DWH aktarımları ve yasal raporlama ile yurt içi/yurt dışı iştiraklerin ihtiyaçlarına yönelik modüler geliştirmeler yürütülmektedir.","kazanim":"Kritik bankacılık altyapılarında dışa bağımlılığın azaltılması, teknoloji sahipliğinin güçlendirilmesi ve kredi kartı altyapısında kurum içi geliştirme kabiliyetinin artırılması","kararlar":[{"no":"Karar 13/7","tarih":"7 Tem 2026","metin":"Banksoft altyapısı yerine Bankamız kaynaklarıyla oluşturulacak altyapıya geçilmesinin Komite gündemine alınarak takip edilmesi."}]},{"g":"calisma","ad":"Analitik Mevduat Fiyatlama","durum":"Çalışılıyor","giris":"8 Haz 2026","hedef":"31 Ara 2026","sorumlu":"Mevduat Yönetimi ve Pazarlama Başkanlığı, Hazine Pazarlama Başkanlığı","amac":"Bireysel fiyatlamanın dinamik hale getirilmesi, kurumsal fiyatlamadaki sürecin kısaltılması, segment farklılıklarına göre oluşturulan mevduat operasyon akışlarında yeknesaklık sağlanması","kapsam":"Hazine ve Mevduat Yönetimi'nin kullandığı veri girdilerinin makine öğrenmesi modelleriyle skorlanması, müşteri bazlı rekabetçi fiyatlama yaklaşımının geliştirilmesi ve tüm fiyatlama taleplerinin VIT üzerinden yönetilmesi kapsam dahilindedir. İkinci fazda müşteri davranış skorlama mekanizmasının geliştirilmesi planlanmaktadır.","kazanim":"GM yetkisindeki fiyatlamada %50 azalış. 10 baz puan kazanımda 277 Mn TL, 20 baz puanda 554 Mn TL mali kazanım. Günlük 300 telefon / 900 e-posta trafiğinde %50 azalış."},{"g":"calisma","ad":"Ödeme ve Tahsilat Platformu","durum":"Çalışılıyor","giris":"8 Haz 2026","hedef":"—","sorumlu":"Ürün Geliştirme, Nakit Yönetimi ve Dış Ticaret Pazarlama Başkanlığı","amac":"Firmalar ve şahıs şirketlerine yönelik başta Nakit Yönetimi, Ödeme Sistemleri ile Nakdi ve Gayrinakdi Kredi ürünleri olmak üzere Bankamız ürünlerinin yanı sıra iş ortakları tarafından sunulan e-ihracat, e-ticaret, finans/muhasebe ve şirket içi yönetim çözümleri gibi katma değerli ürün ve hizmetlerin tek bir platform üzerinden sunulması ve bu suretle pazarlama faaliyetlerimizin desteklenmesi amaçlanmaktadır.","kapsam":"Platformun İnternet Bankacılığı kanalı üzerinden kurulması, Platform Bankacılığı modülünün tanımlanması ve ön yüzün Açık Bankacılık ekibi tarafından geliştirilmesi kapsam dahilindedir. VİNOV, tedarikçi ve bayi finansmanı ürünlerinin platform çatısı altında konumlandırılması ile muhasebe/e-fatura gibi dış firma entegrasyonları da planlanmaktadır.","kazanim":"Platformun temel işlevi, ürünleri sergilemek değil; müşterinin alacağını, tahsilatını, finansman ihtiyacını ve ödemesini birbirine bağlayan bütünsel bir nakit akışı yönetimi sunmaktır.","kararlar":[{"no":"Karar 13/2","tarih":"7 Tem 2026","metin":"Ödeme ve Tahsilat Platformunun İnternet Bankacılığı kanalı üzerinden kurulmasına ilişkin organizasyonel yapı ve ihtiyaçların belirlenerek YK'ya arz edilmesi."},{"no":"Karar 12/1","tarih":"4 Tem 2026","metin":"Ödeme ve Tahsilat Platformu için organizasyonel yapı, uygulama modeli ve ihtiyaçların belirlenerek Yönetim Kurulu'na arz edilmesi."},{"no":"Karar 10/1","tarih":"22 Haz 2026","metin":"B2B ve Firma İş Süreçleri Platformu, Kripto Hizmetleri ve TKD projesinin ayrı oturumlarda sunulması."},{"no":"Karar 9/1","tarih":"16 Haz 2026","metin":"B2B ve Firma İş Yönetimi Platformu için gelir modeli, organizasyon, kaynak, maliyet ve kazanım içeren detaylı fizibilite hazırlanması."}]},{"g":"calisma","ad":"Kripto Hizmetleri","durum":"Çalışılıyor","giris":"8 Haz 2026","hedef":"—","sorumlu":"Hazine Pazarlama Başkanlığı","amac":"Blokzincir teknolojisi kapsamında alım-satım platformu ve saklama hizmeti alanında yapılacak çalışmaların değerlendirilmesi.","kapsam":"Sektör gelişmeleri, regülasyonlar ve kamu bankalarının konumlanmasının değerlendirilmesi ile pazar büyüklüğü, gelir potansiyeli, maliyet yapısı ve operasyonel gereksinimlerin analiz edilmesi kapsam dahilindedir. Öncelikle diğer kamu bankalarıyla ortak platform ve iş birliği alternatiflerinin görüşülmesi, sonuç alınamaması halinde Banka nezdinde saklama hizmetine yönelik çalışmaların başlatılması planlanmaktadır.","kazanim":"Günümüz ve gelecek teknolojisi ile uyum için kripto alım-satım platformu, saklama hizmeti ve tokenizasyon konularında hizmet verilecek.","kararlar":[{"no":"Karar 23/4","tarih":"1 Eki 2026","metin":"Kripto Hizmetleri konusu kapsamında, saklama hizmetine ilişkin kamu bankalarıyla ortak hareket edilmesine yönelik değerlendirme yapılarak bilgi notu hazırlanması ve konunun üst yönetim seviyesinde yeniden ele alınması talimatı verilmiştir."},{"no":"Karar 13/3","tarih":"7 Tem 2026","metin":"Kripto Hizmetlerinde kamu bankalarıyla ortak platform alternatiflerinin önce Başkan, sonra GMY seviyesinde tamamlanarak yol haritasının çıkarılması."},{"no":"Karar 12/2","tarih":"4 Tem 2026","metin":"Kripto Hizmetleri için diğer kamu bankalarıyla iş birliği görüşmesi yapılması; sonuç alınamazsa saklama hizmeti çalışmalarının başlatılması."},{"no":"Karar 10/1","tarih":"22 Haz 2026","metin":"B2B ve Firma İş Süreçleri Platformu, Kripto Hizmetleri ve TKD projesinin ayrı oturumlarda sunulması."}]},{"g":"uygulama","ad":"Yapay Zeka ile Dış Mevzuat Taraması","durum":"Faz 1 bitti","giris":"8 Haz 2026","hedef":"30 Eyl 2026","sorumlu":"Uyum ve Mevzuat Başkanlığı","amac":"Yapay zeka taraması ile Bankayı ilgilendiren mevzuat değişikliklerinin tespit edilmesi.","kapsam":"Resmî Gazete ile Merkez Bankası başta olmak üzere 25 kurumun internet sitesinin Regvion aracılığıyla düzenli izlenmesi ve yeni düzenlemelerin yapay zeka destekli özet, yükümlülük ve ilgili birim bilgileriyle bildirilmesi kapsam dahilindedir. Ayrıca uygulamanın iştiraklerde kullanılması, bildirimlerin VIP App ve Kurumsal Duyuru Sistemi'nde yayımlanması ve iç mevzuata etki analizi için yapay zeka asistanı geliştirilmesi planlanmaktadır.","kazanim":"Mevzuat değişiklikleri zamanında tespit edilerek uyum kapasitesi artacak; operasyonel verimlilik sağlanarak çalışan ihtiyacı azalacak.","kararlar":[{"no":"Karar 24/1","tarih":"9 Eki 2026","metin":"Mevzuat takibi uygulamasının Bankamız iştiraklerinde de kullanılmasına yönelik çalışma yapılması"},{"no":"Karar 24/2","tarih":"9 Eki 2026","metin":"Mevzuat değişikliklerinden kaynaklanan aksiyonların takibine ilişkin İç Sistemler Grup Başkanlığınca yürütülen çalışmalar sonucunda öngörülen organizasyonel değişikliklerin Dönüşüm Komitesi'ne sunulması"},{"no":"Karar 24/3","tarih":"9 Eki 2026","metin":"Mevzuat değişikliklerine ilişkin bilgilendirmelerin VIP App üzerinden de yapılmasına yönelik çalışma yürütülmesi"},{"no":"Karar 24/4","tarih":"9 Eki 2026","metin":"Mevzuat değişikliklerinin Bankamızın iç mevzuatına, uygulamalarına ve ürünlerine etkilerinin değerlendirilmesini destekleyecek yapay zeka asistanı için proje talebi oluşturulması"}]},{"g":"calisma","ad":"Analitik Şube & Portföy Hedef Yönetimi","durum":"Çalışılıyor","giris":"5 May 2026","hedef":"31 Ara 2026","sorumlu":"Performans Yönetimi Başkanlığı","amac":"Banka içi ve dışı girdiler (mevsimsellik, sektör, şube performansı) kullanılarak analiz yapılması; sonucun tüm hedef verme aşamalarında girdi olarak kullanılması.","kapsam":"Satış hedeflerinin banka içi ve dışı verilerle analiz edilerek sahaya bildirilmesi, segmentlerin hedef kalemlerini belirlemesi ve operasyon kalite hedeflerinin şube satış çalışanlarına verilmesi kapsam dahilindedir. Bu çerçevede takım bazlı müşteri yoğunlaşma analizi, il bazlı mevduat/kredi veri tabanı ve Mastercard iş birliğiyle ilçe bazlı potansiyel analizleri yürütülmektedir.","kazanim":"Analitik modeller ve optimizasyon çıktıları ile stratejik hedefler doğrultusunda tüm hedef kalemleri için hedefleme çalışmaları yapılacak.","kararlar":[{"no":"Karar 6/3","tarih":"25 May 2026","metin":"Hedef Yönetimi için Performans Yönetimi Başkanlığı ve Segment Pazarlama Başkanlıklarından aksiyon planı ve takvim talep edilmesi."},{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"calisma","ad":"Doküman Yönetim Sisteminin İyileştirilmesi","durum":"Çalışılıyor","giris":"5 May 2026","hedef":"31 Ara 2026","sorumlu":"Mevduat ve Yatırım Operasyonları Başkanlığı","amac":"Doküman yönetim sisteminde yapılacak iyileştirmeler ile mevcut yapay zeka ve OCR teknolojilerinin kontrollerinin artırılması ve süreçsel iyileştirmeler.","kapsam":"Yapay zeka sonucuna göre belge aktarım engeli, sayfa sayısı ve kimlik tarama zorunluluğu kontrolleri, OCR performans iyileştirmesi ve imza/fotoğraf güncelleme iş akışı kapsam dahilindedir. Ayrıca müşteri eksik belgelerinin ve sözleşme/form onaylarının (BÜHPS, KVKK, internet bankacılığı tanım formu) dijital kanallardan alınması ile tüzel müşteri tanımında dijital onay planlanmaktadır.","kazanim":"Mükerrer tarama engellenecek, operasyonel hata azalacak, OCR performansı iyileşecek. Toplam 6.229 Adam/Gün iş gücü ve zaman tasarrufu.","kararlar":[{"no":"Karar 7/1","tarih":"1 Haz 2026","metin":"DYS kapsamında gerekirse hukuk görüşü alınarak takvimin netleştirilmesi ve çalışmaların hızlandırılması; 9 Planet talebinin önceliklendirilmesi için PYM'ye bilgi verilmesi."},{"no":"Karar 6/6","tarih":"25 May 2026","metin":"DYS projesinin güncel ilerleme durumu hakkında Mevduat ve Yatırım Operasyonları Başkanlığından bilgi istenmesi."},{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"tamam","ad":"Dekontların Dijital Kanallardan Doğrulanması","durum":"Tamamlandı","giris":"5 May 2026","hedef":"—","sorumlu":"Dijital Bankacılık ve Dağıtım Kanalları Başkanlığı","amac":"Dijital kanallardan oluşturulan dekontlara eklenecek QR-Belge Kodu ile müşterilerin dekontlarını doğrulayabilmesi.","kapsam":"Mobil Bankacılık, İnternet Bankacılığı ve web sitesi üzerinden dekont doğrulama altyapısının kurulması ve dijital kanallarda üretilen dekontlara QR kodu ile belge numarası eklenmesi kapsam dahilindedir.","kazanim":"Fiziki imza, onay ve arşiv süreçleri ortadan kalkacak; sıfır sahtecilik riski, anlık teyit ve iyileşen müşteri deneyimi sağlanacak.","kararlar":[{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"calisma","ad":"Şube Süreçlerinin Dijitalleştirilmesi","durum":"Çalışılıyor","giris":"16 Haz 2026","hedef":"—","sorumlu":"Ürün Geliştirme, Nakit Yönetimi ve Dış Ticaret Pazarlama Başkanlığı","amac":"Müşteri şikayetlerine yol açan başta hesap açılış işlemleri ve sözleşmeler olmak üzere Şubede gerçekleştirilen işlemlerin dijitalleştirilerek sadeleştirilmesi.","kapsam":"Bireysel ve ticari hesap açılış süreçleri ile sözleşmelerin diğer banka uygulamalarıyla karşılaştırmalı analiz edilerek sadeleştirilmesi, TÜHPS ve tüzel müşteri tanımında dijital onay, SIM kart bloke kaldırımı ve GKS süreçlerinin dijitalleştirilmesi kapsam dahilindedir. Ayrıca kamulaştırma işlemlerinin şubelerden alınarak Mevduat Operasyonları bünyesinde merkezileştirilmesi bu başlık altında izlenmektedir.","kazanim":"Sözleşmelerin sadeleştirilmesi, hesap açma süreçlerinin gözden geçirilmesi ve sözleşme onaylarının dijitalleşmesi ile müşteri memnuniyeti artacak, süreçler hızlanacak.","alt":["Kamulaştırma İşlemleri Merkezileştirme"],"kararlar":[{"no":"Karar 21/2","tarih":"11 Eyl 2026","metin":"Kamulaştırma sürecinin iyileştirilmesine ilişkin çalışmaların Şube Süreçlerinin Dijitalleştirilmesi başlığı altında izlenmesi."},{"no":"Karar 10/6","tarih":"22 Haz 2026","metin":"Müşteri şikâyetlerine sebep olan bireysel ve ticari hesap açılış süreçleri ve sözleşmelerdeki problemlerin tespiti ve sadeleştirme yapılması."}]},{"g":"uygulama","ad":"Dijital Makam Onayı","durum":"Faz 2 bitti","giris":"8 Haz 2026","hedef":"30 Eyl 2026","sorumlu":"Kurumsal Gelişim ve Akademi Başkanlığı, Kurumsal Mimari ve Akademi Başkanlığı","amac":"Süreç tabanlı iş akışlarında çok seviyeli makam onayı mekanizmasının dijital ortamda yönetilmesi.","kapsam":"Sistemde akışı bulunmayan ve yılda yaklaşık 2.424 işlem ile 15 bin sayfa kağıtla yürütülen makam onaylarının dijital ortama taşınması kapsam dahilindedir. Rol ve yetki bazlı erişim, değiştirilemez işlem geçmişi ve belge versiyon kontrolünün yanı sıra YK Müzekkereleri'nin kapsama alınması ve VIP App Onaylar entegrasyonu planlanmaktadır.","kazanim":"Onay akışı dijitalleşecek, onay takibi anlık izlenecek, merkezi dijital arşivleme yapılacak ve hata riski minimize edilecek.","kararlar":[{"no":"Karar 22/2","tarih":"18 Eyl 2026","metin":"Dijital Makam Onayı uygulamasının yaygınlaştırılması için ilgili birimlerin bilgilendirilmesi ve uygulamanın Banka genelinde duyurulması."},{"no":"Karar 9/3","tarih":"16 Haz 2026","metin":"Dijital Makam Onayı ihtiyaçlarının yıl sonu beklenmeden değerlendirilmesi; çevik yaklaşımla hayata geçirilmesi."},{"no":"Karar 9/4","tarih":"16 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım, YZ Maaş Promosyon, Dijital Performans Puanı ve YZ Dış Mevzuat için sayısal veri ve kazanım içeren aksiyon planı hazırlanması ve tamamlanma tarihlerinin belirlenmesi."},{"no":"Karar 8/2","tarih":"8 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım Formu, YZ Maaş Promosyon, Dijital Performans Puanı, Dekont Tekleştirme ve YZ Dış Mevzuat projelerinin ilgili başkanlıklarca değerlendirilmesi; sayısal veri ve tahmini kazanım içeren aksiyon planı hazırlanması."}]},{"g":"calisma","ad":"Banka Duyuru Sisteminin İyileştirilmesi","durum":"Çalışılıyor","giris":"5 May 2026","hedef":"31 Ara 2026","sorumlu":"Uyum ve Mevzuat Başkanlığı, Kurumsal Gelişim ve Akademi Başkanlığı","amac":"Yapay zeka destekli çalışma ile banka içi duyurulara erişimin kolaylaştırılması, duyuru yapısının sadeleştirilmesi, özet ve istenilen aksiyon bölümlerinin eklenmesi.","kapsam":"Tebliğ özet alanının yapay zeka desteğiyle oluşturulması, gerektiğinde görev ataması olarak düzenlenebilmesi ve etiketleme ile güçlü bir arama motoru kurulması kapsam dahilindedir. Ayrıca güncel olmayan mevzuatın temizlenmesi, onaycı kurgusunun yeniden tasarlanması ve tespit edilen dış mevzuat değişikliklerinin de sistemde yayımlanması planlanmaktadır.","kazanim":"Kontrolsüz dağılımın önüne geçilecek; erişim zorluğu ve karmaşık yapı ortadan kalkacak. Arama başına tasarruf ile yıllık toplam 9,2 Milyon Dakika süre kazanımı.","kararlar":[{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"uygulama","ad":"Dijital Performans Puanı","durum":"Faz 1 bitti","giris":"8 Haz 2026","hedef":"30 Eyl 2026","sorumlu":"Performans Yönetimi Başkanlığı","amac":"Müşterilerin dijital işlem yapmaya yönlendirilmesi ile Bankanın dijitalleşmesine katkı sağlanması.","kapsam":"Şubeden müşteri olmada dijital onay alınması, DTO/TÖS toplu ödeme yüklemelerinin müşteri tarafından yapılması ve talimatların \"Şubeye Talimat Gönder\" ekranından alınmasına yönelik göstergelerin satış personeline KPI olarak verilmesi kapsam dahilindedir. Kriterlerin segment görüşleri alınarak 2026-Q4 performans ölçümüne dahil edilmesi planlanmaktadır.","kazanim":"“Dijital Müşteri” hedefi ile tarama sayısının azaltılması, ticari/karma şubelerde talimatların dijital kanaldan gönderilmesi ve toplu işlem yüklemelerinin müşteri tarafından yapılması.","kararlar":[{"no":"Karar 22/1","tarih":"18 Eyl 2026","metin":"Dijital Performans Puanı: şubeden müşteri olmada dijital onay, DTO/TÖS toplu ödemelerin müşteri tarafından yapılması ve talimatların 'Talimat Gönder' ekranından alınması için satış personeline KPI verilmesi; segment görüşleri alınarak 2026-Q4 performans ölçümüne dahil edilmesi."},{"no":"Karar 9/4","tarih":"16 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım, YZ Maaş Promosyon, Dijital Performans Puanı ve YZ Dış Mevzuat için sayısal veri ve kazanım içeren aksiyon planı hazırlanması ve tamamlanma tarihlerinin belirlenmesi."},{"no":"Karar 8/2","tarih":"8 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım Formu, YZ Maaş Promosyon, Dijital Performans Puanı, Dekont Tekleştirme ve YZ Dış Mevzuat projelerinin ilgili başkanlıklarca değerlendirilmesi; sayısal veri ve tahmini kazanım içeren aksiyon planı hazırlanması."}]},{"g":"calisma","ad":"Farklı Dekont Şablonlarının Tek Şablona Çevrilmesi (Dekont Dönüşümü)","durum":"Çalışılıyor","giris":"8 Haz 2026","hedef":"31 Mar 2027","sorumlu":"Mevduat ve Yatırım Operasyonları Başkanlığı, Bankacılık Operasyonları Başkanlığı","amac":"Farklı şablonlarda ve farklı birimlerce kontrol edilen dekont yapısının sadeleştirilerek tek şablona oturtulması.","kapsam":"Tespit edilen 373 farklı dekont şablonunun (son 6 ayda 234'ü kullanılmıştır) gözden geçirilmesi ve TCKN/VKN, adres, unvan gibi zorunlu unsurların tüm şablonlarda standartlaştırılması kapsam dahilindedir. Ayrıca dekont kontrol sorumluluğunun sadeleştirilmesi ve e-dekont uygulamasının yaygınlaştırılması planlanmaktadır.","kazanim":"Standart kurum dili oluşturulacak, okunabilirlik ve müşteri deneyimi iyileşecek; dekont değişiklikleri hızlı gerçekleştirilecek.","kararlar":[{"no":"Karar 10/7","tarih":"22 Haz 2026","metin":"Farklı şablonlardan oluşan dekont yapısının sadeleştirilmesi."},{"no":"Karar 8/2","tarih":"8 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım Formu, YZ Maaş Promosyon, Dijital Performans Puanı, Dekont Tekleştirme ve YZ Dış Mevzuat projelerinin ilgili başkanlıklarca değerlendirilmesi; sayısal veri ve tahmini kazanım içeren aksiyon planı hazırlanması."}]},{"g":"uygulama","ad":"Maaş Promosyon Süreçlerinin İyileştirilmesi","durum":"Faz 1 bitti","giris":"8 Haz 2026","hedef":"30 Eyl 2026","sorumlu":"Bireysel Bankacılık Pazarlama Başkanlığı","amac":"Maaş promosyon teklif sürecinin uçtan uca sistem üzerinden gerçekleştirilmesi ve şube veri girişlerindeki anomalilerin yapay zeka ile engellenmesi.","kapsam":"Çalışan sayısı, maaş ve bordro verilerinin analiz edilmesi, veri girişlerindeki anomalilerin tespiti ve teklif mektubunun otomatik oluşturulması ilk faz kapsamındadır. Teklif optimizasyonu ve VIT entegre yapay zeka destekli ihale teklifi süreci (Faz-2) sonraki aşamada ele alınmaktadır.","kazanim":"Manuel iş adımları sisteme alınarak operasyonel verimlilik sağlanacak; hatalı veri girişleri önlenerek tekrar eden iş yükü ortadan kalkacak.","kararlar":[{"no":"Karar 9/4","tarih":"16 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım, YZ Maaş Promosyon, Dijital Performans Puanı ve YZ Dış Mevzuat için sayısal veri ve kazanım içeren aksiyon planı hazırlanması ve tamamlanma tarihlerinin belirlenmesi."},{"no":"Karar 8/2","tarih":"8 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım Formu, YZ Maaş Promosyon, Dijital Performans Puanı, Dekont Tekleştirme ve YZ Dış Mevzuat projelerinin ilgili başkanlıklarca değerlendirilmesi; sayısal veri ve tahmini kazanım içeren aksiyon planı hazırlanması."}]},{"g":"uygulama","ad":"Yapay Zeka Firma Tanıtım Formu","durum":"Faz 1 bitti","giris":"8 Haz 2026","hedef":"—","sorumlu":"Değerlendirme ve Derecelendirme Başkanlığı","amac":"Şube çalışanlarının firmalara ilişkin özlük, moralite, reyting ve mali verilere tek yerden hızlı erişmesi ve yapay zeka yorumu ile önemli bilgilere anında ulaşması.","kapsam":"Ticaret Sicil Gazetesi, MERSİS ve diğer dış veri kaynaklarından elde edilen sermaye değişiklikleri, ortaklık yapıları, mali göstergeler ve risk bilgilerinin yapay zeka ile özetlenmesi kapsam dahilindedir. Skor tarihinden sonraki gelişmelerin (mali veri, mizan, ticaret sicil, moralite) tek ekrandan izlenmesi, şubelere öneri/uyarı mekanizmaları ve yapay zeka destekli tahsis analiz föyü de planlanmaktadır.","kazanim":"Bir firma için ortalama 30 dakika süren manuel sorgulamalar, yapay zeka destekli tanıtım föyü ile saniyeler içinde hazır hale gelecek.","kararlar":[{"no":"Karar 9/4","tarih":"16 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım, YZ Maaş Promosyon, Dijital Performans Puanı ve YZ Dış Mevzuat için sayısal veri ve kazanım içeren aksiyon planı hazırlanması ve tamamlanma tarihlerinin belirlenmesi."},{"no":"Karar 8/2","tarih":"8 Haz 2026","metin":"Dijital Makam Onayı, YZ Firma Tanıtım Formu, YZ Maaş Promosyon, Dijital Performans Puanı, Dekont Tekleştirme ve YZ Dış Mevzuat projelerinin ilgili başkanlıklarca değerlendirilmesi; sayısal veri ve tahmini kazanım içeren aksiyon planı hazırlanması."}]},{"g":"tamam","ad":"Mevduat Yönetiminin Organizasyonel Değerlendirmesi","durum":"Tamamlandı","giris":"22 Tem 2026","hedef":"—","sorumlu":"İnsan Kaynakları, Kurumsal Mimari ve Akademi, Performans Yönetimi, KOBİ, Perakende ve Bireysel Bankacılık, Kurumsal ve Ticari Bankacılık, Hazine Yönetimi","amac":"Bankamızdaki mevduat fiyatlamasının organizasyonel anlamda farklı sorumlular tarafından yapılmasının ortadan kaldırılması.","kapsam":"Mevduat fiyatlaması yapan iş birimlerinin organizasyon şemasındaki konumuna ilişkin alternatiflerin avantaj ve dezavantajlarıyla değerlendirilmesi kapsam dahilindedir. Bu çerçevede Başkanlığın Hazine Yönetimi GMY'ye bağlanması ve müdürlüklerin KOBİ, Perakende ve Bireysel ile Kurumsal ve Ticari Mevduat Yönetimi olarak yeniden yapılandırılması kararlaştırılmıştır.","kazanim":"Hazine Yönetimi Genel Müdür Yardımcılığı bünyesinde yer alan mevduat fiyatlama başkanlıklarının, fiyatlamaya etki eden değişkenleri ortak bir yaklaşımla değerlendirerek bütünleşik bir fiyatlama süreci oluşturulması sağlanacak.","kararlar":[{"no":"Karar 16/1","tarih":"22 Tem 2026","metin":"Mevduat Yönetimi ve Pazarlama Başkanlığı'nın Hazine Yönetimi GMY'ye bağlanması; Mevduat Pazarlama Md → KOBİ, Perakende ve Bireysel Mevduat Yönetimi Md; Kaynak Yönetimi Md → Kurumsal ve Ticari Mevduat Yönetimi Md; Başkanlık adı Mevduat Yönetimi Başkanlığı."}]},{"g":"uygulama","ad":"Genel Müdürlük–Saha İletişiminin Artırılması","durum":"Faz 1 bitti","giris":"5 May 2026","hedef":"1 Tem 2026","sorumlu":"Kurumsal Gelişim ve Akademi Başkanlığı","amac":"Şubeler ile Genel Müdürlük birimleri arasındaki iletişimin izleme sistemleri, performans ölçümleri ve anket çalışmaları ile sağlıklı hale getirilmesi.","kapsam":"Çalışma üç fazda planlanmıştır: çağrı istatistikleri altyapısı ve haftalık bildirim (Birim Kokpit), çağrı sonu memnuniyet anketi altyapısı ve sonuçların birim performans sistemine kriter olarak yansıtılması. Çağrı cevaplama oranlarının Başkan ve GMY/GB bazında haftalık paylaşılması ve birimlere KPI tabanlı cevaplama hedefleri verilmesi de kapsam dahilindedir.","kazanim":"İzleme sistemi ve yönetici raporlama altyapısı kuruldu, birim performans kriteri oluşturuldu. Saha ve GM birimleri arasında etkili iletişim sağlanacak.","kararlar":[{"no":"Karar 6/4","tarih":"25 May 2026","metin":"Çağrı cevaplama oranlarının Başkan ve GMY/GB bazında haftalık paylaşılması; çağrı kalitesi anket altyapısının oluşturulması."},{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"tamam","ad":"Performans Sisteminin Sadeleştirilmesi","durum":"Tamamlandı","giris":"29 Nis 2026","hedef":"1 Tem 2026","sorumlu":"Performans Yönetimi Başkanlığı","amac":"Şube performans değerlendirmelerinde sadeleştirmeye gidilmesi ve performansa olumlu etkisi olan bir yapıya geçilmesi.","kapsam":"07.05.2026 tarihinde alınan 9 karar çerçevesinde Denge PK uygulamasının kaldırılması, mevduat maliyetinde segment bazlı KEP uygulamasına geçilmesi, Aksama/Takip koridorunun sadeleştirilmesi ve konkordato etkisinin azaltılması kapsam dahilindedir. Ayrıca Faiz Dışı Gelir kriterinin eklenmesi, 1 PK altı için kademeli prim çalışması ve FTF/kârlılık hesaplamasının gözden geçirilmesi planlanmaktadır.","kazanim":"Karmaşık yapı giderildi, Denge PK bileşeni kaldırıldı, yıldız kriterlerin negatif etkisi azaltıldı; aksama ve takip kriterleri yalnızca olumlu etkileyecek hale getirildi.","kararlar":[{"no":"Karar 4/1","tarih":"7 May 2026","metin":"Denge PK uygulamasının 2026 3. dönem itibarıyla kaldırılması."},{"no":"Karar 4/2","tarih":"7 May 2026","metin":"2026 3. performans dönemi itibarıyla mevduat maliyet hesaplamasında segment bazlı KEP uygulamasına geçilmesi."},{"no":"Karar 4/3","tarih":"7 May 2026","metin":"5 yıl ve öncesinde takibe aktarılan müşterilerin performans sisteminden arındırılarak Aksama/Takip koridor uygulamasının sadeleştirilmesi."},{"no":"Karar 4/4","tarih":"7 May 2026","metin":"Konkordato süreçlerinin performans üzerindeki olumsuz etkisinin azaltılması; ilgili ekiplerin KPI belirleyerek performans sisteminin sadeleştirilmesi."}]},{"g":"uygulama","ad":"Talimatların Yapay Zeka ile İşlenmesi","durum":"Faz 1 bitti","giris":"5 May 2026","hedef":"—","sorumlu":"Bankacılık Operasyonları Başkanlığı","amac":"Müşteri talimatlarının yapay zeka ile otomatik olarak işlem ekranına aktarılması.","kapsam":"Ticari müşterilerin mobil ve internet bankacılığı üzerinden ilettiği talimatların DYS'ye aktarılarak yapay zeka ile işlenmesi, \"Şubeye Talimat Gönder\" menüsü geliştirmeleri ve serbest talimat yazımının kısıtlanması kapsam dahilindedir. Ayrıca bireysel talimat süreçlerine ve Outlook üzerinden iş isteği oluşturulmasına yönelik geliştirmeler yer almaktadır.","kazanim":"Haberleşme, evrak ve arşiv süreci son bulacak; manuel veri girişleri sıfırlanarak işlem doğrudan operasyon çalışanının ekranında görünecek.","kararlar":[{"no":"Karar 6/5","tarih":"25 May 2026","metin":"AI Destekli Müşteri Talimatı projesinin önceliklendirilmesi için Proje Yönetimi ekibiyle görüşülmesi."},{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"tamam","ad":"VIP App","durum":"Tamamlandı","giris":"5 May 2026","hedef":"—","sorumlu":"Dijital Bankacılık ve Dağıtım Kanalları Başkanlığı","amac":"Banka yöneticilerinin Bankaya ait bilgilere mobil uygulama üzerinden erişebilmesi.","kapsam":"Ürün, kampanya, envanter, performans, personel ve proje bilgilerinin uygulamada sunulması, Aksiyon İzleme Sistemi (AİS) ile Ürünler sekmesinin eklenmesi ve takip/yakın izlemedeki müşterilere ilişkin Müşteri Föyü'nün uygulamaya alınması kapsam dahilindedir. Ayrıca mevzuat değişikliği bildirimlerinin ve Dijital Makam Onayı süreçlerinin VIP App üzerinden yapılması planlanmaktadır.","kazanim":"Yöneticiler finansal/finansal olmayan verilere anlık erişebilecek; ürün, kampanya, envanter, performans, personel ve proje bilgilerini görüntüleyip aksiyon izleyebilecek.","kararlar":[{"no":"Karar 24/3","tarih":"9 Eki 2026","metin":"Mevzuat değişikliklerine ilişkin bilgilendirmelerin VIP App üzerinden de yapılmasına yönelik çalışma yürütülmesi"},{"no":"Karar 10/5","tarih":"22 Haz 2026","metin":"Takip ve yakın izlemedeki ilk 50 müşteriyle yapılan görüşmelere VIP App içinde yer verilmesi."},{"no":"Karar 7/2","tarih":"1 Haz 2026","metin":"Yönetici App'in güncel durumunun Genel Müdürlük Makamına sunulması; tamamlanan kısımların kademeli olarak canlıya alınması."},{"no":"Karar 3/1","tarih":"5 May 2026","metin":"İyileştirme alanlarından sorumlu birimlerin aksiyon planlarını oluşturması ve takvimin Dönüşüm Komitesi ile paylaşılması."}]},{"g":"calisma","ad":"Müşteri Verimlilik Yönetimi","durum":"Çalışılıyor","giris":"1 Eyl 2026","hedef":"—","sorumlu":"Strateji ve Ürün Geliştirme Başkanlığı","amac":"Müşterilerin verimliliklerinin ortak ve güvenilir bir metodolojiyle ölçülmesi; müşteri bazında mevcut ve potansiyel değerin görünür hale getirilmesi ve elde edilen verilerin satış süreçlerinde uygulanabilir aksiyonlara dönüştürülmesi","kapsam":"Değer360 ile ürün ve kampanyaların hedef kitleyle eşleştirilmesi, portföye atanması, temas ve aktivasyonun izlenmesi ile taahhüt ve gelir/kârlılık takibinin tek döngüde yönetilmesi kapsam dahilindedir. Değer Pusulası ile de portföy göstergeleri ve önceliklendirilmiş aksiyonların sunulduğu Müşteri 360 ekranı ile taahhütlerin getiriye etkisinin izlendiği Karar Ekranı'nın oluşturulması planlanmaktadır.","kazanim":"Ürün–hedef kitle penetrasyonu, satış aksiyonu, dönüşüm ve finansal etkinin tek döngüde izlenmesiyle kaçırılan fırsatların azaltılması, ürün aktif kullanımının ve gelirin artırılması hedeflenmektedir. Mevcut durumda %58 olan atamalarda zaman aşımı oranının düşürülmesi ve %5 olan olumlu sonuçlanan atama oranının artırılması beklenmektedir.","alt":["Değer360 — Akıllı Satış ve Gelir Yönetimi","Değer Pusulası"],"kararlar":[{"no":"Karar 23/1","tarih":"1 Eki 2026","metin":"Müşteri Verimlilik Yönetimi başlığı altında izlenen Değer Pusulası: Müşteri 360 ve Karar Ekranları projesinin Komite gündemine dahil edilmesine, ilgili paydaşların katılımıyla çalışma grubu oluşturularak kapsamın netleştirilmesine ve projenin hayata geçirilmesine karar verilmiştir."},{"no":"Karar 21/1","tarih":"11 Eyl 2026","metin":"Değer360 modeline ilişkin çalışmaların başlatılması; başkanlık ve paydaşların belirlenerek çalışma grubu kurulması; detayların netleştirilip modelin seçili stratejik ürünlerle devreye alınması."},{"no":"Karar 20/1","tarih":"1 Eyl 2026","metin":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim GB'nin strateji, ürün, süreç ve dönüşüm başlıklarında danışmanlık firmalarıyla görüşme gerçekleştirmesi."},{"no":"Karar 20/2","tarih":"1 Eyl 2026","metin":"Stratejiden dönüşüme, dönüşümden değere iş planının şubelerle görüşülerek yürütülmesi; görüş/öneri alma mekanizmalarıyla dönüşüm programının saha odaklı beslenmesi."}]},{"g":"uygulama","ad":"Bireysel Segment Yönetimi","durum":"Faz 1 bitti","giris":"1 Eyl 2026","hedef":"—","sorumlu":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim, KOBİ, Perakende ve Bireysel Bankacılık","amac":"Bireysel müşterileri doğru konumlandırarak, operasyonun uygun ölçüde merkezileştiği ve portföy yöneticisinin müşteri değeri yaratmaya odaklandığı yeni bireysel segment yönetim modelinin tasarlanması","kapsam":"Bireysel portföy yöneticisi ihtiyacının diğer bankalarla karşılaştırmalı olarak tespiti, özel bankacılık müşteri segmentasyonu ve dijital müşteri segmentasyonuna dayalı dijital portföy yönetimi kapsam dahilindedir. Bu çerçevede İstanbul'da 10 şube ve 10 portföy yöneticisiyle dijital müşterilere planlı ve veri odaklı temas sağlanmasına yönelik pilot uygulama planlanmaktadır.","kazanim":"Portföy yöneticilerinin daha geniş bir müşteri havuzuna veri odaklı hizmet vermesiyle portföy verimliliğinin artırılması hedeflenmektedir. Pilot uygulamada 90 günlük izleme süresince müşteri aktifliği ve cüzdan payı kazanımlarının ölçülmesi öngörülmektedir.","kararlar":[{"no":"Karar 25/2","tarih":"15 Eki 2026","metin":"Bireysel Segment Yönetimi konusu kapsamında bilgilendirilmesi yapılan yeni portföy yönetim modelinin pilot çalışma ve/veya yaygınlaşma sürecinin gözlemlenerek sonuçlarının Dönüşüm Komitesi'ne sunulması"},{"no":"Karar 20/1","tarih":"1 Eyl 2026","metin":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim GB'nin strateji, ürün, süreç ve dönüşüm başlıklarında danışmanlık firmalarıyla görüşme gerçekleştirmesi."},{"no":"Karar 20/2","tarih":"1 Eyl 2026","metin":"Stratejiden dönüşüme, dönüşümden değere iş planının şubelerle görüşülerek yürütülmesi; görüş/öneri alma mekanizmalarıyla dönüşüm programının saha odaklı beslenmesi."},{"no":"Karar 20/3","tarih":"1 Eyl 2026","metin":"Bireysel Portföy Yöneticilerinin daha geniş kapsamlı bir müşteri havuzuna hizmet verdiği yapıya geçilmesi."}]},{"g":"calisma","ad":"Gayrinakdi Krediler","durum":"Çalışılıyor","giris":"1 Eyl 2026","hedef":"—","sorumlu":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim, Operasyonel İşlemler","amac":"Gayrinakdi kredilerin tüm süreçlerinin merkezileştirilmesi","kapsam":"Gayrinakdi kredi süreçlerinin uçtan uca ele alınarak merkezi bir işletim modeline taşınması kapsam dahilindedir. Çalışmanın, \"stratejiden dönüşüme, dönüşümden değere\" iş planı çerçevesinde şubelerin görüş ve önerileri alınarak yürütülmesi planlanmaktadır.","kazanim":"Süreçlerin merkezileştirilmesiyle gayrinakdi kredi işlemlerinde standart, hızlı ve kontrollü bir işleyiş sağlanması ve şube operasyonel yükünün azaltılması hedeflenmektedir.","kararlar":[{"no":"Karar 20/1","tarih":"1 Eyl 2026","metin":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim GB'nin strateji, ürün, süreç ve dönüşüm başlıklarında danışmanlık firmalarıyla görüşme gerçekleştirmesi."},{"no":"Karar 20/2","tarih":"1 Eyl 2026","metin":"Stratejiden dönüşüme, dönüşümden değere iş planının şubelerle görüşülerek yürütülmesi; görüş/öneri alma mekanizmalarıyla dönüşüm programının saha odaklı beslenmesi."}]},{"g":"calisma","ad":"Veri Analitiği","durum":"Çalışılıyor","giris":"1 Eyl 2026","hedef":"—","sorumlu":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim, Dijital Bankacılık, Ödeme Sistemleri ve Kurumsal İletişim","amac":"Ürün ve müşterilerin verilerinin analiz edilerek dönüşüm fırsatı üretme kabiliyeti ve dönüşüm sonuçlarının doğru ölçülmesi","kapsam":"Ürün Analitiği ve Müşteri Analitiği alt başlıklarında dönüşüm fırsatı üretmeye ve sonuçların ölçülmesine yönelik analitik çalışmaların yapılması kapsam dahilindedir. Çalışmanın Müşteri Verimlilik Yönetimi (Değer360) ile ilişkili olarak yürütülmesi planlanmaktadır.","kazanim":"Dönüşüm projelerinin veriye dayalı olarak önceliklendirilmesi ve sağlanan kazanımların ölçülebilir şekilde raporlanması hedeflenmektedir.","kararlar":[{"no":"Karar 20/1","tarih":"1 Eyl 2026","metin":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim GB'nin strateji, ürün, süreç ve dönüşüm başlıklarında danışmanlık firmalarıyla görüşme gerçekleştirmesi."},{"no":"Karar 20/2","tarih":"1 Eyl 2026","metin":"Stratejiden dönüşüme, dönüşümden değere iş planının şubelerle görüşülerek yürütülmesi; görüş/öneri alma mekanizmalarıyla dönüşüm programının saha odaklı beslenmesi."}]},{"g":"calisma","ad":"Müşteri Edinimi & Yönetimi","durum":"Çalışılıyor","giris":"1 Eyl 2026","hedef":"—","sorumlu":"Güvenli Bankacılık Başkanlığı","amac":"Statik ve beyana dayalı müşteri profilinden; doğrulanmış veri, davranış, geçmiş ve risk sinyallerini birlikte değerlendiren dinamik ve 360° müşteri yönetimine geçiş","kapsam":"Müşteri edinim aşamasında beyan edilen bilgilerin doğrulanmış veri kaynaklarıyla desteklenmesi ve müşteri profilinin davranış, geçmiş ve risk sinyalleriyle sürekli güncellenmesine yönelik yapının tasarlanması kapsam dahilindedir.","kazanim":"Müşteri risk değerlendirmesinin güçlendirilmesi ve müşteri yönetiminde daha isabetli kararlar alınması hedeflenmektedir.","kararlar":[{"no":"Karar 20/1","tarih":"1 Eyl 2026","metin":"Strateji, Ürün Geliştirme ve Kurumsal Gelişim GB'nin strateji, ürün, süreç ve dönüşüm başlıklarında danışmanlık firmalarıyla görüşme gerçekleştirmesi."},{"no":"Karar 20/2","tarih":"1 Eyl 2026","metin":"Stratejiden dönüşüme, dönüşümden değere iş planının şubelerle görüşülerek yürütülmesi; görüş/öneri alma mekanizmalarıyla dönüşüm programının saha odaklı beslenmesi."}]},{"g":"calisma","ad":"Basel IV Uyum Dönüşümü","durum":"Çalışılıyor","giris":"1 Eki 2026","hedef":"30 Eyl 2027","sorumlu":"İç Sistemler","amac":"Basel IV’e uyum kapsamında risk ağırlıklı varlıklar ve sermaye ihtiyacındaki değişim ile kullanılmayan limitlerin sermaye tüketimine etkisi gibi Bankamıza yönelik olası etkiler dikkate alınarak; Basel IV’ün portföy, teminat vel imitlere etkisine yönelik aksiyonların hayata geçirilmesi","kapsam":"Risk Yönetimi Başkanlığı'nın yol haritasını çıkararak Aktif Pasif Komitesi'nde sunması, iş birimlerinin portföy, teminat ve limit aksiyonlarına ilişkin hazırlıklarını yapması ve yasal raporlamaya hazırlık kapsam dahilindedir. İş birimlerinin hazırlık durumlarının düzenli olarak raporlanması ve tam geçiş sonrasında etkinin izlenmesi planlanmaktadır.","kazanim":"Portföy, teminat ve limit yönetimiyle Basel IV kaynaklı sermaye ihtiyacı artışının sınırlandırılması ve kullanılmayan limitlerin sermaye tüketiminin azaltılması hedeflenmektedir. Ayrıca yasal raporlama yükümlülüklerine zamanında uyum sağlanması beklenmektedir.","kararlar":[{"no":"Karar 23/3","tarih":"1 Eki 2026","metin":"Basel IV’e ilişkin Bankamız yol haritasının Aktif Pasif Komitesi’nde sunulması ve konunun DönüşümKomitesi gündemine alınarak takip edilmesi talimatı verilmiştir."}]},{"g":"calisma","ad":"İştirak Sinerji Programı","durum":"Çalışılıyor","giris":"1 Eki 2026","hedef":"—","sorumlu":"Finansal Yönetim ve Ortaklıklar","amac":"2025 yılında konsolide kârın %13,3’ünün iştiraklerden sağlandığı (seçili 9 banka ortalaması %30,5) dikkate alınarak; iştiraklerin tek tek büyümesinden Banka ile birlikte değer üreten bir grup modeline geçişi hedefleyen, ortak müşteri yönetimi, ortak altyapı, entegre çözüm ve satış ile ortak performans yönetimi başlıklarından oluşan program","kapsam":"Program; ortak müşteri yönetimi, ortak altyapı, entegre çözüm ve satış ile ortak performans yönetimi başlıklarından oluşmaktadır. İştiraklerin mevcut durumunun çıkarılması, iştirak bazında ve finansal grup olarak strateji oluşturulması ve şirketlerin birlikte nasıl büyüyeceğine dair planlama yapılması kapsam dahilindedir.","kazanim":"İştiraklerin konsolide kâra katkısının artırılması ve Banka ile iştirakler arasında ortak müşteri, ortak altyapı ve entegre satış sinerjilerinin oluşturulması hedeflenmektedir.","kararlar":[{"no":"Karar 23/6","tarih":"1 Eki 2026","metin":"İştirak Sinerji Programı’nın Dönüşüm Komitesi kapsamında ele alınarak takip edilmesi talimatı verilmiştir."}]},{"g":"calisma","ad":"Dijital Satış Dönüşümü","durum":"Çalışılıyor","giris":"1 Eki 2026","hedef":"—","sorumlu":"Sorumlu başkanlık girilmedi","amac":"Şube dışı kanal kullanımının %98, dijital müşteri sayısının 16,5 milyon seviyesinde olduğu dikkate alınarak; dijital kanallarda doğru müşteriye, doğru anda, doğru ürünün konumlandırılması ve iş birimlerince dijital işlemlerle bağlantılı ürün ve hizmetlerin sunulmasına yönelik çalışmaların hayata geçirilmesi","kapsam":"İş birimlerince, müşterilerin dijital kanallarda gerçekleştirdikleri işlemlerin ardından bağlantılı olabilecek ürün ve hizmetlerin belirlenmesi ve sunulmasına yönelik kullanım senaryolarının oluşturulması kapsam dahilindedir. Bu çerçevede satış fırsatları ve kullanım senaryolarının Banka genelinden toplanmasına yönelik çalışma başlatılmıştır.","kazanim":"Dijital kanallardaki yüksek işlem hacminin satış fırsatına dönüştürülmesiyle dijital satışın ve müşteri başına ürün sayısının artırılması hedeflenmektedir.","kararlar":[{"no":"Karar 23/7","tarih":"1 Eki 2026","metin":"Dijital Satış Dönüşümü konusunun Komite kapsamında ele alınarak takip edilmesi talimatı verilmiştir."}]},{"g":"calisma","ad":"API ve Gömülü Finans","durum":"Çalışılıyor","giris":"1 Eki 2026","hedef":"—","sorumlu":"Sorumlu başkanlık girilmedi","amac":"API’lerin Bankanın platformlarda ve ekosistemlerde yer almasının ön koşulu olduğu dikkate alınarak; Banka ürün <script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   VERİ
   ============================================================ */
const DATA = JSON.parse(document.getElementById('data').textContent);
const T = DATA.topics, D = DATA.decisions, S = DATA.schedule, META = DATA.meta;

const ST = {
  calisma:  { label: 'Çalışılıyor', hex: '#F2B544' },
  uygulama: { label: 'Uygulamada',  hex: '#3CC8DC' },
  tamam:    { label: 'Tamamlandı',  hex: '#5FE0A2' },
};
const ORDER = ['calisma', 'uygulama', 'tamam'];
const COUNT = { all: T.length };
ORDER.forEach(k => COUNT[k] = T.filter(t => t.g === k).length);

const C = {
  bg: '#050B18', txt: '#E6ECF5', sub: '#B3C0D6', mut: '#7F90AE', gold: '#F2B544',
  line: 'rgba(130,160,210,0.20)', card: 'rgba(20,36,64,0.70)', panel: 'rgba(9,18,36,0.96)',
};

// karar no -> konu indeksleri, konu adı -> indeks
const topicsByDec = {};
T.forEach((t, i) => (t.kararlar || []).forEach(k => { (topicsByDec[k.no] ||= []); if (!topicsByDec[k.no].includes(i)) topicsByDec[k.no].push(i); }));
const decIdx = {}; D.forEach((d, i) => decIdx[d.no] = i);
const topicByName = {}; T.forEach((t, i) => topicByName[t.ad] = i);

const AY = { Oca: 0, 'Şub': 1, Mar: 2, Nis: 3, May: 4, Haz: 5, Tem: 6, 'Ağu': 7, Eyl: 8, Eki: 9, Kas: 10, Ara: 11 };
const AY_AD = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
function mo(s) { // 1 Nisan 2026'dan itibaren ay cinsinden
  const m = /(\d+)\s+(\S+)\s+(\d{4})/.exec(s || ''); if (!m || !(m[2] in AY)) return null;
  return (+m[3] - 2026) * 12 + AY[m[2]] - 3 + (+m[1] - 1) / 31;
}
const SNAP = mo('16 Kas 2026');

/* ============================================================
   RENDERER / SAHNE
   ============================================================ */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = innerWidth, H = innerHeight, MOBILE = W < 760;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.setAttribute('aria-label', 'Dönüşüm Takip Sistemi — etkileşimli 3B dönüşüm portföyü');
renderer.domElement.tabIndex = 0;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.FogExp2(0x050b18, 0.0085);
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1400);
camera.position.set(0, 10, 150);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.85, 0.55, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hud = new THREE.Scene();
const hudCam = new THREE.OrthographicCamera(0, W, H, 0, -100, 100);

/* ============================================================
   METİN / TUVAL YARDIMCILARI
   ============================================================ */
const FAM = 'Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const F = (s, w = 500) => `${w} ${s}px ${FAM}`;
const mctx = document.createElement('canvas').getContext('2d');

function alpha(hex, a) {
  if (hex.startsWith('rgba')) return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  const q = Array.isArray(r) ? r[0] : r;
  ctx.moveTo(x + q, y); ctx.arcTo(x + w, y, x + w, y + h, q); ctx.arcTo(x + w, y + h, x, y + h, q);
  ctx.arcTo(x, y + h, x, y, q); ctx.arcTo(x, y, x + w, y, q); ctx.closePath();
}
function setLS(ctx, v) { if ('letterSpacing' in ctx) ctx.letterSpacing = (v || 0) + 'px'; }
function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(/\s+/).filter(Boolean);
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (line && ctx.measureText(test).width > maxW) { out.push(line); line = w; } else line = test;
    }
    out.push(line);
  }
  return out;
}

/* Basit belge düzeni: öğeleri (metin, hap, kutu, sütun…) ölçüp çizim komutlarına çevirir */
function lay(items, x, y, w, ctx = mctx) {
  const ops = [], hits = [];
  for (const it of items) {
    if (!it) continue;
    y += it.mt || 0;
    const y0 = y;
    if (it.t === 'text') {
      ctx.font = F(it.size, it.weight || 500); setLS(ctx, it.ls);
      const ind = it.indent || 0, mw = w - ind;
      const txt = it.upper ? String(it.text).toLocaleUpperCase('tr-TR') : String(it.text);
      let lines = it.nowrap ? [txt] : wrap(ctx, txt, mw);
      if (it.maxLines && lines.length > it.maxLines) { lines = lines.slice(0, it.maxLines); lines[lines.length - 1] += '…'; }
      lines = lines.map(l => { if (ctx.measureText(l).width <= mw) return l; let s = l; while (s && ctx.measureText(s + '…').width > mw) s = s.slice(0, -1); return s.trimEnd() + '…'; });
      const lh = it.size * (it.lh || 1.42);
      for (const l of lines) {
        const ax = it.align === 'center' ? x + ind + mw / 2 : it.align === 'right' ? x + w : x + ind;
        ops.push({ k: 't', s: l, x: ax, y: y + lh / 2, f: ctx.font, c: it.color || C.txt, a: it.align || 'left', ls: it.ls || 0, sh: it.shadow });
        y += lh;
      }
      setLS(ctx, 0);
    } else if (it.t === 'pill') {
      const sz = it.size || 12; ctx.font = F(sz, 700);
      const tw = ctx.measureText(it.text).width, h = sz + 13, pw = tw + (it.dot ? 36 : 24);
      const px = it.align === 'right' ? x + w - pw : it.align === 'center' ? x + (w - pw) / 2 : x;
      ops.push({ k: 'pill', x: px, y, w: pw, h, c: it.color, s: it.text, f: ctx.font, dot: it.dot, fill: it.fill });
      if (it.action) hits.push({ x: px, y, w: pw, h, action: it.action });
      y += h;
    } else if (it.t === 'rule') {
      ops.push({ k: 'r', x, y, w, h: 1, c: it.color || C.line }); y += 1;
    } else if (it.t === 'space') {
      y += it.h;
    } else if (it.t === 'box') {
      const p = it.pad ?? 16, ac = it.accent ? 6 : 0;
      const op = { k: 'box', x, y, w, h: 0, bg: it.bg || C.card, b: it.border || C.line, r: it.r ?? 12, accent: it.accent, act: it.action };
      ops.push(op);
      const r = lay(it.items, x + p + ac, y + p, w - 2 * p - ac, ctx);
      op.h = Math.max(it.minH || 0, r.y - y + p);

/* ============================================================
   KARUSEL yardımcısı (Takvim ve Kararlar)
   ============================================================ */
function carousel(items, { R, step, concave, wrapAround }) {
  return {
    items, R, step, concave, wrapAround, focus: 0, target: 0, dragging: false,
    place(dt) {
      if (!this.dragging) this.focus = damp(this.focus, this.target, 5, dt);
      const n = this.items.length;
      this.items.forEach((m, i) => {
        let d = i - this.focus;
        if (this.wrapAround) { d = ((d % n) + n * 1.5) % n - n / 2; }
        const th = d * this.step;
        if (this.concave) { m.position.set(Math.sin(th) * this.R, m.userData.y0 || 0, this.R - Math.cos(th) * this.R); m.rotation.y = -th; }
        else { m.position.set(Math.sin(th) * this.R, m.userData.y0 || 0, Math.cos(th) * this.R - this.R); m.rotation.y = th; }
        const f = this.wrapAround ? Math.max(0, Math.cos(th)) : 1 - Math.min(0.55, Math.abs(d) * 0.3);
        m.material.opacity = this.wrapAround ? Math.pow(f, 1.6) : f;
        m.visible = m.material.opacity > 0.02;
      });
    },
    nearest() { const n = this.items.length; return this.wrapAround ? ((Math.round(this.focus) % n) + n) % n : THREE.MathUtils.clamp(Math.round(this.focus), 0, n - 1); },
    goto(i) {
      const n = this.items.length;
      if (this.wrapAround) { let d = i - this.focus; d = ((d % n) + n * 1.5) % n - n / 2; this.target = Math.round(this.focus + d); }
      else this.target = THREE.MathUtils.clamp(i, 0, n - 1);
    },
    drag(dx, scale) { this.dragging = true; this.focus -= dx * scale; if (!this.wrapAround) this.focus = THREE.MathUtils.clamp(this.focus, -0.4, this.items.length - 0.6); },
    release(v) { this.dragging = false; let t = Math.round(this.focus - v * 4); if (!this.wrapAround) t = THREE.MathUtils.clamp(t, 0, this.items.length - 1); this.target = t; },
  };
}

const VIEWS = [V0, V1, V2, V3, V4];

/* ============================================================
   KAMERA
   ============================================================ */
function anchor(i) {
  const L = VIEWS[i].layout();
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, tv = Math.tan(vf);
  const usable = (H - (MOBILE ? 150 : 150)) / H;             // HUD için pay
  const dh = (L.h / 2) / tv / usable, dw = L.fitH ? 0 : (L.w / 2) / (tv * camera.aspect);
  const dist = Math.max(dh, dw) * 1.06;
  const tgt = center(i).add(L.look || new THREE.Vector3());
  const dir = new THREE.Vector3(0, L.elev || 0, 1).normalize();
  // HUD üst/alt dengesizliğini telafi et (alt menü daha yüksek)
  const shift = (MOBILE ? 20 : 18) / H * 2 * tv * dist;
  tgt.y -= shift * (L.elev ? 0.4 : 1);
  return { pos: tgt.clone().addScaledVector(dir, dist), tgt };
}
function goTo(i, instant) {
  i = THREE.MathUtils.clamp(i, 0, VIEWS.length - 1);
  if (Panel.open) Panel.close();
  const changed = i !== current; current = i;
  const a = anchor(i);
  if (instant) { basePos.copy(a.pos); baseTarget.copy(a.tgt); }
  else {
    const p0 = basePos.clone(), t0 = baseTarget.clone(), far = p0.distanceTo(a.pos) > 20;
    flying = true;
    tween(far ? 1.9 : 0.8, e => {
      basePos.lerpVectors(p0, a.pos, e); baseTarget.lerpVectors(t0, a.tgt, e);
      if (far) { basePos.y += Math.sin(e * Math.PI) * 7; basePos.x += Math.sin(e * Math.PI) * (i % 2 ? -6 : 6); }
    }, ease.io, () => flying = false);
  }
  VIEWS[i].enter && VIEWS[i].enter(changed);
  buildHUD();
  Tip.hide();
}
function updateCamera(dt) {
  par.x = damp(par.x, parT.x, 2.5, dt); par.y = damp(par.y, parT.y, 2.5, dt);
  camera.position.copy(basePos);
  const right = new THREE.Vector3().subVectors(baseTarget, basePos).cross(camera.up).normalize();
  camera.position.addScaledVector(right, par.x * 1.4).addScaledVector(camera.up, par.y * 0.9);
  camera.lookAt(baseTarget);
}

/* ============================================================
   HUD (ortografik katman — tamamı WebGL)
   ============================================================ */
const hudBase = new THREE.Group(); hud.add(hudBase);
let hudHits = [];
function hudPlace(m, d, x, y, z = 0) { m.scale.set(d.W, d.H, 1); m.position.set(Math.round(x) + d.W / 2, H - (Math.round(y) + d.H / 2), z); m.renderOrder = z; }
function hudMesh(d, x, y, z = 0, parent = hudBase) {
  const m = new THREE.Mesh(UNIT, new THREE.MeshBasicMaterial({ map: d.tex, transparent: true, depthTest: false, depthWrite: false }));
  hudPlace(m, d, x, y, z); parent.add(m); return m;
}
function canvasTex(w, h, draw) {
  const d = { W: w, H: h, cv: document.createElement('canvas') };
  d.cv.width = Math.ceil(w * DPR); d.cv.height = Math.ceil(h * DPR);
  const ctx = d.cv.getContext('2d'); ctx.scale(DPR, DPR); ctx.textBaseline = 'middle'; draw(ctx);
  d.tex = new THREE.CanvasTexture(d.cv); d.tex.colorSpace = THREE.SRGBColorSpace; d.tex.generateMipmaps = false; d.tex.minFilter = THREE.LinearFilter;
  return d;
}

function buildHUD() {
  while (hudBase.children.length) disposeObj(hudBase.children[0]);
  hudHits = [];
  const M = MOBILE, m = M ? 14 : 22;
  // marka
  const brand = docTex([
    { t: 'text', text: META.baslik, size: M ? 15 : 18, weight: 800, color: C.txt, lh: 1.2 },
    { t: 'text', text: META.alt, size: M ? 11 : 12.5, weight: 500, color: C.mut, mt: 2 },
  ], M ? 210 : 320, { hud: true, S: DPR });
  hudMesh(brand, m, M ? 12 : 18);
  const accent = canvasTex(4, brand.H - 6, c => { c.fillStyle = C.gold; rr(c, 0, 0, 3, brand.H - 6, 2); c.fill(); });
  hudMesh(accent, m - 10, (M ? 12 : 18) + 3);
  // güncelleme
  const upd = docTex([
    { t: 'text', text: META.guncellemeEt, size: 10.5, weight: 700, color: C.mut, align: 'right', upper: true, ls: 1 },
    { t: 'text', text: META.guncelleme, size: M ? 12.5 : 14, weight: 700, color: C.txt, align: 'right', mt: 2 },
  ], 140, { hud: true, S: DPR });
  hudMesh(upd, W - m - 140, M ? 12 : 18);

  // alt menü
  const navH = M ? 52 : 46, navY = H - navH - (M ? 12 : 22);
  const fs = M ? 12 : 13.5;
  mctx.font = F(fs, 600);
  let labels = VIEW_LABELS, pad = M ? 10 : 18;
  let widths = labels.map(l => mctx.measureText(l).width + pad * 2);
  let total = widths.reduce((a, b) => a + b, 0) + 12;
  if (total > W - 24) { labels = VIEW_SHORT; widths = labels.map(l => mctx.measureText(l).width + pad * 2); total = widths.reduce((a, b) => a + b, 0) + 12; }
  if (total > W - 16) { const ww = (W - 16 - 12) / labels.length; widths = labels.map(() => ww); total = W - 16; }
  const nx = (W - total) / 2;
  const nav = canvasTex(total, navH, c => {
    c.fillStyle = 'rgba(8,16,32,0.82)'; rr(c, 0.5, 0.5, total - 1, navH - 1, navH / 2); c.fill();
    c.strokeStyle = 'rgba(120,160,220,0.25)'; c.lineWidth = 1; c.stroke();
    let x = 6;
    labels.forEach((l, i) => {
      const w = widths[i];
      if (i === current) { c.fillStyle = C.gold; rr(c, x, 6, w, navH - 12, (navH - 12) / 2); c.fill(); }
      c.font = F(fs, i === current ? 700 : 600); c.textAlign = 'center'; c.fillStyle = i === current ? '#0a1222' : C.sub;
      c.fillText(l, x + w / 2, navH / 2 + 0.5);
      hudHits.push({ x: nx + x, y: navY, w, h: navH, action: { type: 'view', i } });
      x += w;
    });
  });
  hudMesh(nav, nx, navY, 2);
  // ilerleme noktaları (masaüstü sağ kenar)
  if (!M) {
    const dots = canvasTex(14, VIEWS.length * 22, c => { VIEWS.forEach((_, i) => { c.fillStyle = i === current ? C.gold : 'rgba(150,175,215,0.35)'; c.beginPath(); c.arc(7, 11 + i * 22, i === current ? 4.5 : 3, 0, 7); c.fill(); }); });
    hudMesh(dots, W - 30, H / 2 - dots.H / 2);
    VIEWS.forEach((_, i) => hudHits.push({ x: W - 36, y: H / 2 - dots.H / 2 + i * 22, w: 26, h: 22, action: { type: 'view', i } }));
  }
  // ipucu
  const hint = docTex([{ t: 'text', text: HINTS[current], size: M ? 11.5 : 12.5, weight: 500, color: C.mut, align: 'center' }], Math.min(W - 20, 520), { hud: true, S: DPR });
  hudMesh(hint, (W - hint.W) / 2, navY - hint.H - (M ? 6 : 10));
  // filtre çipleri
  if (current === 1 || current === 2) {
    const list = [['all', 'Tümü', null], ...ORDER.map(k => [k, ST[k].label, ST[k].hex])];
    const cfs = M ? 11.5 : 13; mctx.font = F(cfs, 600);
    const cpad = M ? 9 : 14, dotW = 14;
    let cw = list.map(([k, l]) => mctx.measureText(l + '  ' + COUNT[k]).width + cpad * 2 + (k === 'all' ? 0 : dotW));
    const gap = 6; let tw = cw.reduce((a, b) => a + b, 0) + gap * (list.length - 1);
    let fsc = 1; if (tw > W - 16) { fsc = (W - 16 - gap * 3) / (tw - gap * 3); cw = cw.map(x => x * fsc); tw = W - 16; }
    const chH = M ? 30 : 34, cy = M ? 64 : 22, cx = (W - tw) / 2;
    if (M || W > 1000) {
      const chips = canvasTex(tw, chH, c => {
        let x = 0;
        list.forEach(([k, l, hex], i) => {
          const on = filter === k, w = cw[i];
          c.fillStyle = on ? (hex ? alpha(hex, 0.22) : 'rgba(230,236,245,0.16)') : 'rgba(8,16,32,0.78)';
          rr(c, x + 0.5, 0.5, w - 1, chH - 1, chH / 2); c.fill();
          c.strokeStyle = on ? (hex || '#E6ECF5') : 'rgba(120,160,220,0.25)'; c.lineWidth = 1; c.stroke();
          let tx = x + cpad * fsc; const cf = cfs * fsc;
          if (hex) { c.fillStyle = hex; c.beginPath(); c.arc(tx + 4, chH / 2, 4, 0, 7); c.fill(); tx += dotW * fsc; }
          c.font = F(cf, 600); c.textAlign = 'left'; c.fillStyle = on ? '#fff' : C.sub; c.fillText(l, tx, chH / 2 + 0.5);
          const lw = c.measureText(l + '  ').width; c.font = F(cf, 800); c.fillStyle = hex || C.txt; c.fillText(String(COUNT[k]), tx + lw, chH / 2 + 0.5);
          hudHits.push({ x: cx + x, y: cy, w, h: chH, action: { type: 'filter', k } });
          x += w + gap;
        });
      });
      hudMesh(chips, cx, cy, 1);
    }
  }
}

/* İpucu kutusu */
const Tip = {
  m: null, key: null, d: null,
  show(tip, x, y) {

    const key = tip.kind === 'topic' ? 't' + tip.i : tip.key;
    if (key !== this.key) {
      this.hide(); this.key = key;
      let items;
      if (tip.kind === 'topic') {
        const t = T[tip.i];

          { t: 'pill', text: t.durum, color: ST[t.g].hex, size: 11, dot: true, mb: 8 },

/* ============================================================
   AYRINTI PANELİ (HUD içinde, kaydırılabilir WebGL tuvali)
   ============================================================ */
const Panel = {
  open: false, kind: null, idx: 0, scroll: 0, vel: 0, a: 0, hov: null,
  show(kind, idx) {
    this.kind = kind; this.idx = idx; this.scroll = 0; this.vel = 0;
    V1.sel = V2.sel = -1;
    if (kind === 'topic') { if (current === 1) V1.sel = idx; if (current === 2) V2.sel = idx; }
    this.build();
    if (!this.open) { this.open = true; this.a = 0; tween(0.45, p => this.a = p, ease.out); }
    Tip.hide();
  },
  close() {
    if (!this.open) return; this.open = false; V1.sel = V2.sel = -1;

  },
  dispose() { if (this.grp) disposeObj(this.grp); this.grp = null; this.cv = null; },
  list() { return this.kind === 'topic' ? T : D; },
  step(d) { const n = this.list().length; this.show(this.kind, (this.idx + d + n) % n); if (this.kind === 'decision' && current === 4) V4.car.goto(this.idx); },
  items() {
    const M = MOBILE;
    const sec = (s, extra) => ({ t: 'text', text: s + (extra ? '   ' + extra : ''), size: 12.5, weight: 800, color: C.gold, upper: true, ls: 1.4, mt: 26, mb: 10 });
    const body = s => ({ t: 'text', text: s, size: M ? 15 : 16, weight: 400, color: C.sub, lh: 1.62 });
    if (this.kind === 'topic') {
      const t = T[this.idx], st = ST[t.g];
      const it = [
        { t: 'text', text: t.ad, size: M ? 23 : 30, weight: 800, color: '#fff', lh: 1.2, mt: 6, mb: 18 },
        { t: 'cols', gap: 12, mb: 14, cols: [
          [{ t: 'box', pad: 14, items: [{ t: 'text', text: 'Komiteye giriş', size: 11.5, weight: 700, color: C.mut, upper: true, ls: 1, mb: 4 }, { t: 'text', text: t.giris, size: M ? 16 : 18, weight: 700 }] }],
          [{ t: 'box', pad: 14, items: [{ t: 'text', text: 'Hedef tarih', size: 11.5, weight: 700, color: C.mut, upper: true, ls: 1, mb: 4 }, { t: 'text', text: t.hedef, size: M ? 16 : 18, weight: 700 }] }],
        ] },
        { t: 'text', text: t.sorumlu, size: 14, weight: 600, color: C.mut, lh: 1.5 },
        sec('Amaç'), body(t.amac), sec('Kapsam'), body(t.kapsam), sec('Beklenen kazanım'), body(t.kazanim),
      ];
      if (t.alt) it.push(sec('Alt konular'), { t: 'bullets', list: t.alt, size: M ? 15 : 16, weight: 600, color: C.txt, dot: st.hex });
      if (t.kararlar && t.kararlar.length) {
        it.push(sec('İlgili komite kararları', String(t.kararlar.length)));
        t.kararlar.forEach((k, j) => {
          const di = decIdx[k.no];
          it.push({ t: 'box', mt: j ? 10 : 0, pad: 16, accent: alpha(st.hex, 0.9), action: di != null ? { type: 'decision', i: di } : null, items: [
            { t: 'text', text: `${k.no} · ${k.tarih}`, size: 14, weight: 800, color: C.txt, mb: 5 },
            { t: 'text', text: k.metin, size: M ? 14.5 : 15, weight: 400, color: C.sub, lh: 1.55 },
          ] });
        });
      }
      it.push({ t: 'space', h: 24 });
      return it;
    }
    const d = D[this.idx], rel = topicsByDec[d.no] || [];
    const it = [
      { t: 'text', text: d.no, size: M ? 28 : 36, weight: 800, color: '#fff', mt: 6 },
      { t: 'text', text: `${d.tarih} · ${d.toplanti}`, size: 14.5, weight: 600, color: C.mut, mt: 4, mb: 18 },
      { t: 'text', text: d.metin, size: M ? 16.5 : 18, weight: 500, color: C.txt, lh: 1.62 },
      sec('Sorumlu'), body(d.sorumlu),
    ];
    if (rel.length) {
      it.push(sec('İlgili konular', String(rel.length)));
      rel.forEach((ti, j) => it.push({ t: 'box', mt: j ? 10 : 0, pad: 14, accent: alpha(ST[T[ti].g].hex, 0.9), action: { type: 'topic', i: ti }, items: [
        { t: 'pill', text: T[ti].durum, color: ST[T[ti].g].hex, size: 11, dot: true, mb: 8 },
        { t: 'text', text: T[ti].ad, size: 16, weight: 700, color: C.txt },
      ] }));
    }
    it.push({ t: 'space', h: 24 });
    return it;
  },
  build() {
    const M = MOBILE;
    const pw = M ? W - 16 : Math.min(800, W - 80), top = M ? 10 : 78, ph = M ? H - 20 : H - 78 - 30;
    this.r = { x: Math.round((W - pw) / 2), y: top, w: pw, h: ph };
    this.headH = 66; this.pad = M ? 18 : 34;
    const res = lay(this.items(), this.pad, 0, pw - this.pad * 2);

    this.viewH = ph - this.headH; this.maxScroll = Math.max(0, res.y - this.viewH);
    if (!this.cv || this.cv.width !== Math.ceil(pw * DPR) || this.cv.height !== Math.ceil(ph * DPR)) {

      this.cv = document.createElement('canvas'); this.cv.width = Math.ceil(pw * DPR); this.cv.height = Math.ceil(ph * DPR);
      this.ctx = this.cv.getContext('2d');
      this.tex = new THREE.CanvasTexture(this.cv); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.generateMipmaps = false; this.tex.minFilter = THREE.LinearFilter;
      this.grp = new THREE.Group(); hud.add(this.grp);
      this.back = new THREE.Mesh(UNIT, new THREE.MeshBasicMaterial({ color: '#02060f', transparent: true, opacity: 0, depthTest: false, depthWrite: false }));
      this.back.renderOrder = 30; this.grp.add(this.back);
      this.mesh = new THREE.Mesh(UNIT, new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, opacity: 0, depthTest: false, depthWrite: false }));
      this.mesh.renderOrder = 31; this.grp.add(this.mesh);
    }
    this.back.scale.set(W, H, 1); this.back.position.set(W / 2, H / 2, 0);
    this.mesh.scale.set(pw, ph, 1); this.mesh.position.set(this.r.x + pw / 2, H - (this.r.y + ph / 2), 0);
    this.btns = [
      { x: pw - 50, y: 14, w: 38, h: 38, s: '×', action: 'close' },
      { x: pw - 50 - 46, y: 14, w: 38, h: 38, s: '›', action: 'next' },
      { x: pw - 50 - 92, y: 14, w: 38, h: 38, s: '‹', action: 'prev' },
    ];
    this.draw();
  },
  draw() {
    const c = this.ctx, { w, h } = this.r;
    c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, w, h);
    c.fillStyle = C.panel; rr(c, 0.5, 0.5, w - 1, h - 1, 22); c.fill();
    c.strokeStyle = 'rgba(242,181,68,0.35)'; c.lineWidth = 1.2; c.stroke();
    c.save(); rr(c, 0.5, 0.5, w - 1, h - 1, 22); c.clip();
    const glow = c.createRadialGradient(w * 0.15, 0, 0, w * 0.15, 0, w * 0.8); glow.addColorStop(0, 'rgba(242,181,68,0.08)'); glow.addColorStop(1, 'rgba(242,181,68,0)');
    c.fillStyle = glow; c.fillRect(0, 0, w, h);
    // içerik
    c.save(); c.beginPath(); c.rect(0, this.headH, w, this.viewH); c.clip();
    paint(c, this.ops, this.headH - this.scroll, this.headH, h, this.hov);
    c.restore();
    // başlık şeridi
    const fg = c.createLinearGradient(0, this.headH - 4, 0, this.headH + 18); fg.addColorStop(0, 'rgba(9,18,36,1)'); fg.addColorStop(1, 'rgba(9,18,36,0)');
    c.fillStyle = 'rgba(9,18,36,1)'; c.fillRect(0, 0, w, this.headH - 4); c.fillStyle = fg; c.fillRect(0, this.headH - 4, w, 22);
    const g2 = c.createLinearGradient(0, 0, w, 0); g2.addColorStop(0, 'rgba(242,181,68,0)'); g2.addColorStop(0.5, C.gold); g2.addColorStop(1, 'rgba(242,181,68,0)');
    c.fillStyle = g2; c.fillRect(0, 0, w, 2.5);
    c.restore();
    // başlık: durum hapı + sayaç
    const isT = this.kind === 'topic', it = isT ? T[this.idx] : D[this.idx];
    const pillR = lay([{ t: 'pill', text: isT ? it.durum : it.durum, color: isT ? ST[it.g].hex : '#3CC8DC', size: 12.5, dot: true }], this.pad, 18, 300);
    paint(c, pillR.ops);
    c.font = F(12.5, 600); c.fillStyle = C.mut; c.textAlign = 'left'; c.textBaseline = 'middle';
    const pw_ = pillR.ops[0].w;
    const lbl = `${this.idx + 1} / ${this.list().length}` + (MOBILE ? '' : (isT ? ' · ' + VIEW_LABELS[1] : ' · ' + VIEW_LABELS[4]));
    c.fillText(lbl, this.pad + pw_ + 12, 33);
    for (const b of this.btns) {
      const on = this.hov === b.action;
      c.fillStyle = on ? C.gold : 'rgba(40,64,104,0.55)'; rr(c, b.x, b.y, b.w, b.h, 12); c.fill();
      c.strokeStyle = 'rgba(150,180,230,0.3)'; c.lineWidth = 1; c.stroke();
      c.fillStyle = on ? '#0a1222' : C.txt; c.font = F(b.s === '×' ? 24 : 26, 600); c.textAlign = 'center'; c.fillText(b.s, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }
    // kaydırma çubuğu
    if (this.maxScroll > 0) {
      const th = Math.max(40, this.viewH * this.viewH / (this.viewH + this.maxScroll)), ty = this.headH + (this.viewH - th - 12) * (this.scroll / this.maxScroll) + 6;
      c.fillStyle = 'rgba(150,180,230,0.12)'; rr(c, w - 7, this.headH + 6, 3, this.viewH - 12, 2); c.fill();
      c.fillStyle = 'rgba(242,181,68,0.7)'; rr(c, w - 7, ty, 3, th, 2); c.fill();
    }

  },
  hit(x, y) { // ekran koordinatı -> eylem
    const lx = x - this.r.x, ly = y - this.r.y;
    if (lx < 0 || ly < 0 || lx > this.r.w || ly > this.r.h) return { outside: true };
    for (const b of this.btns) if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) return { btn: b.action };
    if (ly > this.headH) { const cy = ly - this.headH + this.scroll; for (const h of this.hits) if (lx >= h.x && lx <= h.x + h.w && cy >= h.y && cy <= h.y + h.h) return { action: h.action }; }

  },
  scrollBy(dy) { const s = THREE.MathUtils.clamp(this.scroll + dy, 0, this.maxScroll); if (s !== this.scroll) { this.scroll = s; this.draw(); } },
  update(dt) {
    if (!this.grp) return;
    this.back.material.opacity = 0.62 * this.a; this.mesh.material.opacity = this.a;
    this.mesh.position.y = H - (this.r.y + this.r.h / 2) - (1 - this.a) * 40;
    if (Math.abs(this.vel) > 0.3) { this.scrollBy(this.vel * dt * 60); this.vel *= Math.pow(0.02, dt); if (this.scroll <= 0 || this.scroll >= this.maxScroll) this.vel = 0; }
